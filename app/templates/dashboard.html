<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RootCause Stream</title>
<!-- v4 (2026-11-23) 용접 검사 성적서. 강판 바탕 위 성적서 한 장, 검사원의 노란 페인트 마커, 판정 고무 도장.
     AI 가 쓴 문장은 명조(검사원 메모), 양식은 고딕. 한 화면(1920×1080)에 스크롤 없이 — 발표장 프로젝터 기준.
     글꼴은 맥 기본(산돌고딕 Neo · 애플명조)이라 인터넷 없이도 같다. 화면에 설명 문구를 덧붙이지 않는다. -->
<style>
  :root{
    --steel:#CDD3D8; --steel-2:#BCC4CB; --sheet:#F4F5F2; --ink:#1A2129; --ink-2:#47525E; --rule:#A7B0B8;
    --marker:#F5C518; --red:#B8282B; --green:#2B7651; --blue:#2C5A86;
    --sans:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    --serif:"AppleMyungjo","Nanum Myeongjo","Noto Serif KR",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--steel);color:var(--ink);font:18px/1.5 var(--sans);font-variant-numeric:tabular-nums;
       display:grid;grid-template-rows:64px 1fr auto;min-height:100vh}
  .hidden{display:none!important}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--marker);outline-offset:2px}

  /* 머리 */
  header{display:flex;align-items:center;gap:28px;padding:0 32px;background:var(--ink);color:var(--sheet)}
  .mark{font-weight:800;font-size:21px;letter-spacing:-.01em}
  .mark b{display:inline-block;width:14px;height:14px;margin-right:10px;background:var(--marker);transform:rotate(45deg)}
  #equip{margin-left:auto;font-size:15px;color:#AEB7C0}
  #replayBadge{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:16px;color:#DDE2E6}
  #replayBadge i{font-style:normal;font-weight:700;color:var(--marker)}
  #progress{position:absolute;left:0;top:64px;height:4px;background:var(--marker);width:0;transition:width .25s linear}

  /* 본문: 사건 · 무대 · 성적서 */
  main{display:grid;grid-template-columns:250px minmax(0,1.25fr) minmax(0,1fr);gap:24px;padding:24px 32px 0;min-height:0}
  aside h2,.field>h3{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--ink-2)}
  .case{display:block;width:100%;text-align:left;border:0;border-left:6px solid transparent;background:none;
        padding:12px 14px;margin-bottom:6px;cursor:pointer}
  .case:hover{background:var(--steel-2)}
  .case .id{font-size:19px;font-weight:800}
  .case .what{font-size:16px;color:var(--ink-2)}
  .case.on{background:var(--sheet);border-left-color:var(--ink)}

  /* 무대: 지금 보는 것 하나 */
  #stage{position:relative;min-height:0;display:flex;flex-direction:column}
  .stage-h{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 16px}
  .shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
  .shot{margin:0}
  .shot .frame{position:relative;background:#0D1116;aspect-ratio:1/1;overflow:hidden}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .ref{position:absolute;right:10px;bottom:10px;width:28%;border:3px solid var(--sheet);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .shot .ref img{aspect-ratio:1/1}
  .shot .ref span{position:absolute;left:-3px;right:-3px;top:-30px;background:var(--sheet);text-align:center;font-size:14px;font-weight:700;color:var(--ink);padding:2px 0}
  .shot figcaption{display:flex;align-items:baseline;gap:12px;margin-top:10px}
  .shot figcaption b{font-size:22px}
  .chip{font-size:15px;font-weight:700;padding:2px 10px;border:2px solid currentColor;background:var(--sheet)}
  .chip.bad{color:var(--red)} .chip.ok{color:var(--green)} .chip.wait{color:var(--ink-2)}
  .note{font-family:var(--serif);font-size:19px;line-height:1.7;margin-top:8px;color:var(--ink)}
  .note .rest{color:var(--ink-2);font-size:17px}
  .more{cursor:pointer}
  .more .rest{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .more.open .rest{display:block}
  .nm{font-weight:700;color:var(--ink)}
  /* 검사원의 노란 마커: 불량으로 읽힌 사진에 원을 그린다 */
  .marker{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .marker ellipse{fill:none;stroke:var(--marker);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;
                  animation:draw .9s .2s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .reading::after{content:"";position:absolute;left:0;right:0;height:3px;top:0;background:var(--marker);animation:sweep 1.6s linear infinite}
  @keyframes sweep{to{top:100%}}

  /* 촬영 요청 = 작업 지시 쪽지 */
  .order{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:26px;align-items:start}
  .order ol{margin:0;padding:0;list-style:none;counter-reset:o}
  .order li{counter-increment:o;background:var(--sheet);padding:18px 20px 18px 64px;position:relative;margin-bottom:14px;border-top:4px solid var(--ink)}
  .order li::before{content:counter(o);position:absolute;left:20px;top:14px;font-size:30px;font-weight:800}
  .order li b{display:block;font-size:21px;line-height:1.35}
  .order li p{margin:6px 0 0;font-size:16px;color:var(--ink-2)}
  .order li .why{font-family:var(--serif);font-size:17px;color:var(--ink);margin-top:8px}
  .phone{width:190px;border:8px solid var(--ink);border-radius:30px;background:var(--sheet);padding:12px 10px 14px}
  .phone .bar{width:50px;height:6px;border-radius:3px;background:var(--ink);margin:0 auto 10px}
  .phone .t{font-size:11px;font-weight:800;margin-bottom:6px}
  .phone .r{font-size:11px;line-height:1.35;font-weight:600;border-top:2px solid var(--ink);padding:6px 0 8px}
  .phone .go{background:var(--ink);color:var(--sheet);text-align:center;font-size:13px;font-weight:800;padding:9px 0;margin-top:4px}
  .qr{width:190px;background:#fff;padding:8px}
  .qr+div{font-size:12px;color:var(--ink-2);word-break:break-all;margin-top:6px}
  .live-ctl{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .live-ctl button{border:2px solid var(--ink);background:var(--sheet);padding:6px;cursor:pointer;font-size:14px;text-align:left}
  .live-ctl img{width:110px;height:76px;object-fit:cover;display:block}
  .live-ctl .flat{border:0;background:none;text-decoration:underline;color:var(--ink-2)}

  /* 기록 그림: 전류 파형 · 관리도 */
  .plot{background:var(--sheet);padding:20px 24px}
  .plot svg{display:block;width:100%;height:auto}
  .plot .cap{display:flex;gap:24px;font-size:16px;color:var(--ink-2);margin-top:8px}

  /* 성적서 */
  #sheet{background:var(--sheet);box-shadow:0 1px 0 var(--rule),0 18px 40px -24px rgba(26,33,41,.55);
         padding:22px 26px 26px;min-height:0;overflow:auto;position:relative}
  .head{display:flex;align-items:baseline;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:10px;flex-wrap:wrap}
  .head .no{font-size:34px;font-weight:800;letter-spacing:-.02em}
  .head .sub{font-size:16px;color:var(--ink-2)}
  .field{padding:10px 0;border-bottom:1px solid var(--rule)}
  .field:last-child{border-bottom:0}
  table.m{width:100%;border-collapse:collapse;font-size:17px}
  table.m td{padding:2px 0;border-bottom:1px dotted var(--rule)}
  table.m td:nth-child(2){font-weight:800;font-size:21px;text-align:right;padding-right:16px}
  table.m td:nth-child(3){color:var(--ink-2);font-size:15px}
  table.m td:last-child{text-align:right;font-weight:700}
  .edge{color:#8A5A00}
  .hyp{display:grid;grid-template-columns:minmax(0,1fr) 64px;align-items:center;column-gap:12px;padding:4px 0;cursor:pointer}
  .hyp .n{justify-self:start;font-size:18px;font-weight:600;color:var(--ink-2)}
  .hyp .p{text-align:right;font-weight:800;font-size:20px;color:var(--ink-2)}
  .hyp .meter{grid-column:1/-1;height:6px;background:#DCE0E3;margin-top:3px}
  .hyp .meter i{display:block;height:100%;background:var(--ink-2);transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .hyp .full{grid-column:1/-1;display:none;font-size:15px;color:var(--ink-2);margin-top:6px}
  .hyp.open .full{display:block}
  .hyp.lead .n{color:var(--ink);font-weight:800;background:linear-gradient(transparent 52%,var(--marker) 52%,var(--marker) 92%,transparent 92%)}
  .hyp.lead .p{color:var(--ink)}
  .hyp.lead .meter i{background:var(--ink)}
  .up{color:var(--green);font-size:15px} .down{color:var(--red);font-size:15px}
  #state{margin-left:auto;font-size:15px;font-weight:700;color:var(--ink-2)}
  #state.wait{color:var(--blue)}

  /* 판정 도장 — 화면에서 단 한 번 크게 움직이는 것 */
  #final .verdict{display:flex;align-items:center;gap:22px;margin:4px 0 14px}
  .stamp{flex:none;border:6px double currentColor;padding:10px 22px 8px;transform:rotate(-7deg);text-align:center;
         font-weight:900;line-height:1;animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both;mix-blend-mode:multiply}
  .stamp .w{font-size:46px;letter-spacing:.08em;white-space:nowrap}
  .stamp .c{font-size:15px;font-weight:700;margin-top:6px;letter-spacing:0}
  .stamp.bad{color:var(--red)} .stamp.ok{color:var(--green)} .stamp.other{color:var(--blue)}
  @keyframes stamp{0%{transform:rotate(-7deg) scale(2.2);opacity:0}100%{transform:rotate(-7deg) scale(1);opacity:.92}}
  #final .note{font-size:18px;line-height:1.6}
  #final .title{font-size:26px;font-weight:800;line-height:1.25}
  .cites{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:15px;color:var(--ink-2)}
  .cites span{border-bottom:2px solid var(--marker)}

  /* 아래: 실제 시간 막대 */
  #time{position:relative;margin:30px 48px 18px;height:84px;border-top:3px solid var(--ink)}
  #time .tick{position:absolute;top:-9px;transform:translateX(-50%);text-align:center;white-space:nowrap}
  #time .tick i{display:block;width:15px;height:15px;margin:0 auto;background:var(--sheet);border:3px solid var(--ink);border-radius:50%}
  #time .tick.k-ask i,#time .tick.k-human i{background:var(--blue);border-color:var(--blue)}
  #time .tick.k-read i{background:var(--marker)}
  #time .tick.k-done i{background:var(--ink)}
  #time .tick b{display:block;font-size:15px;margin-top:6px}
  #time .tick small{display:block;font-size:13px;color:var(--ink-2)}
  #time .tick.alt b{margin-top:46px}
  #head{position:absolute;top:-14px;width:3px;height:24px;background:var(--red);transition:left .25s linear}

  #replayGate{position:fixed;inset:0;background:rgba(26,33,41,.82);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9}
  #replayGate>div{background:var(--sheet);padding:40px 56px;text-align:center}
  #replayGate b{display:block;font-size:30px}
  footer{font-size:13px;color:var(--ink-2);padding:0 32px 14px}
  @media (max-height:900px),(max-width:1500px){
    html,body{height:auto} body{grid-template-rows:64px auto auto}
    main{grid-template-columns:200px minmax(0,1.2fr) minmax(0,1fr);gap:18px;padding:18px 20px 0}
    #sheet{overflow:visible} #time{margin:34px 36px 18px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.marker ellipse{stroke-dashoffset:0}}
</style>
</head>
<body>
<header>
  <div class="mark"><b></b>RootCause Stream</div>
  <div id="replayBadge" class="hidden"></div>
  <div id="equip">진단 {{model}}, 사진 판독 {{vlm}}</div>
</header>
<div id="progress"></div>

<div id="replayGate" class="hidden"><div><b>실제 실행 기록 재생</b><span id="gateInfo"></span></div></div>

<main>
  <aside>
    <h2>사건</h2>
    {% for c in cases %}
    <button onclick="start('{{c.id}}')" id="case-{{c.id}}" class="case">
      <div class="id">{{c.id}}</div>
      <div class="what">{{c.blurb or ({'level_shift': '수준 이동', 'burst': '알람 폭주'}.get(c.kind, c.kind))}}</div>
    </button>
    {% endfor %}
  </aside>

  <section id="stage"></section>

  <section id="sheet">
    <div class="head"><div class="no" id="no">—</div><div class="sub" id="sub"></div><div id="state"></div></div>
    <div class="field" id="record"></div>
    <div class="field"><h3>가설</h3><div id="hyps"></div></div>
    <div class="field hidden" id="final"></div>
  </section>
</main>

<div id="time"><div id="head" class="hidden"></div></div>

<script>
let es = null, sid = null, lastScores = {}, REPLAY = null, READS = [], T0 = null, TMAX = 60, TICKS = [];
// 서버 없이 여는 내보내기 파일(scripts/export_replay_html.py)은 녹화 기록과 사진을 페이지 안에 싣는다
const EMBED = window.__EMBED__ || null;
const photoURL = p => (EMBED && EMBED.photos[p]) || `/photo?path=${encodeURIComponent(p)}`;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOOL_KO = {search_manual: '매뉴얼 검색', lookup_diagram: '도면 찾기', query_timeseries: '공정 기록 조회',
                 recall_cases: '과거 사례 찾기', query_sql: '기록 직접 질의'};
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

// 화면에 보여 줄 때만 내부 기호(E1, H2)를 이름으로 바꾼다 — 녹화된 원문은 그대로, 기호는 마우스를 올리면 보인다
let EVN = {}, HN = {};
const shortName = st => String(st || '').split(/[:：]|[.。](?:\s|$)/)[0].replace(/\s*\([A-Za-z][^)]*\)/g, '').trim();
function named(text){
  return esc(text).replace(/\s?\(([EH]\d+)\)/g, '').replace(/\b[EH]\d+\(([^)]*)\)/g, '<span class="nm">$1</span>')
    .replace(/\b([EH]\d+)\b/g, (m, id) => {
      const n = id[0] === 'E' ? EVN[id] : HN[id];
      return n ? `<span title="${id}" class="nm">${esc(n)}</span>` : m;
    });
}
const evName = id => EVN[id] || id;
// 첫 문장은 그대로, 나머지는 두 줄까지 — 누르면 전부 (원문을 줄이지 않는다)
function more(text){
  const t = String(text || '').trim(), m = t.match(/^(.+?[.!?。])(\s+)([\s\S]+)$/);
  if (!m) return `<div>${named(t)}</div>`;
  return `<div class="more" onclick="this.classList.toggle('open')"><div>${named(m[1])}</div><div class="rest">${named(m[3])}</div></div>`;
}
function koLabel(stmt){
  const t = String(stmt || '');
  if (/[가-힣]/.test(t)) return esc(shortName(t));
  const name = /expulsion|splash/i.test(t) ? '날림' : /acceptable|no (visible )?defect/i.test(t) ? '정상 용접'
    : /burn-through/i.test(t) ? '용락' : /cold|undersized|missing nugget/i.test(t) ? '용융 부족'
    : /misalign|off-cent/i.test(t) ? '전극 정렬 불량' : /data|acquisition|record/i.test(t) ? '데이터 수집 이상' : '';
  return esc(name || t.split(/[.:—(]/)[0].trim());
}
// 판정 도장 글자와 색
function stampOf(title){
  if (/날림|용락|부족|불량/.test(title)) return ['bad', /날림/.test(title) ? '날림' : '불량'];
  if (/정상|합격|허용/.test(title)) return ['ok', '정상'];
  if (/데이터|기록|수집/.test(title)) return ['other', '기록 이상'];
  return ['other', '확인'];
}

// ── 시간 막대: 사건 시작부터 실제 경과 시간 위에 한 일을 찍는다 ──
function tick(kind, label, t){
  if (T0 === null) T0 = t;
  const at = t - T0, last = TICKS[TICKS.length - 1];
  if (last && at - last.at < 1) { last.label += '\n' + label; last.kind = kind; }
  else TICKS.push({kind, label, at});
  layoutTicks();
}
function layoutTicks(){
  const W = $('time');
  W.querySelectorAll('.tick').forEach(e => e.remove());
  let lastX = -1e9, alt = false;
  TICKS.forEach(k => {
    const x = 96 * Math.min(1, k.at / TMAX) + 2;
    alt = (x - lastX) < 7 ? !alt : false; lastX = x;
    const d = document.createElement('div');
    d.className = `tick k-${k.kind}${alt ? ' alt' : ''}`; d.style.left = x + '%';
    d.innerHTML = `<i></i><b>${k.label.split('\n').map(esc).join('<br>')}</b><small>${fmt(k.at)}</small>`;
    W.appendChild(d);
  });
}
function playhead(s){
  const h = $('head'); h.classList.remove('hidden'); h.style.left = (96 * Math.min(1, s / TMAX) + 2) + '%';
  $('progress').style.width = (100 * Math.min(1, s / TMAX)) + '%';
}

function setState(text, wait){ $('state').textContent = text || ''; $('state').className = wait ? 'wait' : ''; }

function resetUI(caseId){
  if (es) es.close();
  document.querySelectorAll('.case').forEach(b => b.classList.toggle('on', b.id === 'case-' + caseId));
  TICKS = []; T0 = null; EVN = {}; HN = {}; lastScores = {}; READS = [];
  layoutTicks(); $('head').classList.add('hidden'); $('progress').style.width = 0;
  $('no').textContent = caseId; $('sub').textContent = ''; $('record').innerHTML = '';
  $('hyps').innerHTML = ''; $('final').classList.add('hidden'); $('stage').innerHTML = '';
  setState('가설을 세우는 중');
}

async function start(caseId){
  // 내보낸 재생 파일: 누른 사건의 실제 실행 기록을 재생한다 (재생 중이면 그 사건으로 바로 넘어간다)
  if (EMBED) {
    const run = Object.values(EMBED.runs || {}).find(r => r.meta.case_id === caseId);
    if (run) playRun(run, +(P.get('speed') || 4), +(P.get('cap') || 3.5));
    return;
  }
  if (REPLAY) return;
  resetUI(caseId); TMAX = 60;
  const r = await fetch('/api/sessions', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({case_id: caseId})});
  sid = (await r.json()).session_id;
  es = new EventSource(`/api/sessions/${sid}/stream`);
  es.onmessage = e => handle(JSON.parse(e.data));
  es.addEventListener('end', () => es.close());
}

// ── 기록 그림 ──
function wave(vals, band){
  if (!vals || vals.length < 2) return '';
  const W = 800, H = 240, px = 8, py = 16, hi = Math.max(...vals), lo = Math.min(...vals, band ? band[0] : Infinity), span = (hi - lo) || 1;
  const X = i => px + i * (W - 2 * px) / (vals.length - 1), Y = v => H - py - (v - lo) / span * (H - 2 * py);
  const line = vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const mi = vals.indexOf(hi), top = band ? Math.min(band[1], hi) : 0;
  const b = band ? `<rect x="0" y="${Y(top)}" width="${W}" height="${Y(band[0]) - Y(top)}" fill="#DCE0E3"/>` : '';
  return `<div class="plot"><svg viewBox="0 0 ${W} ${H}">${b}
      <path d="${line}" fill="none" stroke="#1A2129" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="${X(mi)}" cy="${Y(hi)}" r="8" fill="#B8282B"/></svg>
    <div class="cap"><span>전류 파형</span><span>최대 ${Math.round(hi).toLocaleString()} A</span>${band ? `<span>회색 띠는 같은 설정 용접들의 최대 전류 범위</span>` : ''}</div></div>`;
}
function control(sh){
  const [lo, hi] = sh.control_limits, c = sh.control_center, v = sh.day_value;
  const min = Math.min(lo, v) - (hi - lo) * .6, max = hi + (hi - lo) * .6, W = 800, H = 240;
  const Y = x => H - (x - min) / (max - min) * H;
  return `<div class="plot"><svg viewBox="0 0 ${W} ${H}">
      <rect x="0" y="${Y(hi)}" width="${W}" height="${Y(lo) - Y(hi)}" fill="#DCE0E3"/>
      <line x1="0" x2="${W}" y1="${Y(c)}" y2="${Y(c)}" stroke="#47525E" stroke-width="2" stroke-dasharray="6 6"/>
      <circle cx="${W * .62}" cy="${Y(v)}" r="12" fill="#B8282B"/>
      <text x="${W * .62 + 24}" y="${Y(v) + 8}" font-size="26" font-weight="800" fill="#1A2129">${v} bar</text></svg>
    <div class="cap"><span>그날 용접 압력 중앙값</span><span>관리 범위 ${lo.toFixed(2)} ~ ${hi.toFixed(2)} bar</span></div></div>`;
}
function row(label, v, unit, d){
  const out = d && d.p10 !== undefined && (v < d.p10 || v > d.p90);
  return `<tr><td>${label}</td><td>${Math.round(v).toLocaleString()} ${unit}</td>
    <td>${d ? `${Math.round(d.p10).toLocaleString()} ~ ${Math.round(d.p90).toLocaleString()}` : ''}</td>
    <td class="${out ? 'edge' : ''}">${out ? '범위 끝' : '보통'}</td></tr>`;
}

function shot(path, face, ref, state, reading){
  const chip = state === 'bad' ? '<span class="chip bad">합격품과 다름</span>' : state === 'ok' ? '<span class="chip ok">합격품과 비슷</span>'
             : state === 'reading' ? '<span class="chip wait">읽는 중</span>' : '';
  return `<figure class="shot"><div class="frame ${state === 'reading' ? 'reading' : ''}">
      <img src="${photoURL(path)}" alt="${esc(face)}">
      ${state === 'bad' ? '<svg class="marker" viewBox="0 0 100 100"><ellipse cx="50" cy="47" rx="21" ry="19" transform="rotate(-8 50 47)"/></svg>' : ''}
      ${ref ? `<div class="ref"><img src="${photoURL(ref)}" alt="합격품"><span>합격품</span></div>` : ''}</div>
    <figcaption><b>${esc(face)}</b>${chip}</figcaption>
    ${reading ? `<div class="note">${more(reading)}</div>` : ''}</figure>`;
}

function handle(ev){
  if (ev.type === 'incident') {
    tick('llm', '가설', ev.t ?? 0);
    const s = ev.summary || {};
    if (ev.kind === 'weld_quality') {
      const sp = s.setpoints || {}, lg = s.logged_during_weld || {}, pop = s.same_setpoint_population || {};
      $('sub').textContent = `공압 ${sp.air_pressure_psi} psi, 통전 ${sp.weld_time_ms} ms`;
      $('record').innerHTML = `<h3>용접 기록 (같은 설정 ${pop.n_welds || ''}회와 비교)</h3><table class="m">
        ${row('최대 전류', lg.peak_current_A, 'A', pop.peak_current_A)}${row('평균 전류', lg.mean_current_A, 'A', pop.mean_current_A)}
        ${row('누르는 힘', lg.peak_force_N, 'N', pop.peak_force_N)}</table>`;
      const pc = pop.peak_current_A;
      $('stage').innerHTML = `<h2 class="stage-h">용접 중 기록</h2>${wave(lg.current_A, pc ? [pc.p10, pc.p90] : null)}`;
    } else {
      const sh = s.shift || {};
      const w = (ev.window || []).map(x => String(x).replace('T', ' ').slice(0, 16));
      $('sub').textContent = w.length === 2 ? `${w[0]} ~ ${w[1].slice(0, 10) === w[0].slice(0, 10) ? w[1].slice(11) : w[1]}` : '';
      $('record').innerHTML = `<h3>알람</h3><table class="m"><tr><td>${ev.kind === 'level_shift' ? '수준 이동' : '알람 폭주'}</td><td>${ev.alarm_count}건</td><td></td><td></td></tr></table>`;
      $('stage').innerHTML = `<h2 class="stage-h">공정 기록</h2>${sh.control_limits ? control(sh) : ''}`;
    }
    return;
  }
  if (ev.type === 'step') {
    renderHyps(ev.hypotheses);
    if (ev.evidence) EVN[ev.evidence.id] = TOOL_KO[ev.tool] || ev.tool || ev.evidence.id;
    if (ev.action === 'use_tool') tick('tool', TOOL_KO[ev.tool] || ev.tool, ev.t ?? 0);
    if (ev.action === 'request_photo') tick('ask', '촬영 요청', ev.t ?? 0);
    if (ev.action === 'finalize') tick('done', '결론', ev.t ?? 0);
    return;
  }
  if (ev.type === 'photo_request') {
    READS = []; renderHyps(ev.hypotheses); setState('작업자의 사진을 기다리는 중', true);
    const items = ev.requests.map(r => `<li><b>${esc(r.target)}</b><p>${esc(r.how_to_shoot)}</p><div class="why">${esc(r.why_this_photo)}</div></li>`).join('');
    $('stage').innerHTML = `<h2 class="stage-h">촬영 요청</h2><div class="order"><ol>${items}</ol><div>
        ${REPLAY ? phone(ev.requests) : `<img class="qr" src="/qr/${ev.token}.png" alt="QR"><div>${esc(ev.upload_url)}</div>`}</div>
        ${REPLAY ? '' : '<div class="live-ctl" id="demoOpts"></div>'}</div>`;
    if (!REPLAY) loadDemo();
    return;
  }
  if (ev.type === 'photo_received') {
    tick('human', `사진 도착${ev.face ? ' (' + ev.face + ')' : ''}`, ev.t ?? 0);
    setState('사진을 읽는 중', true);
    const cur = shot(ev.photo, ev.face ? ev.face + ' 사진' : '받은 사진', ev.reference, 'reading');
    $('stage').innerHTML = `<h2 class="stage-h">사진 판독</h2><div class="shots">${READS.join('')}${cur}</div>`;
    return;
  }
  if (ev.type === 'photo_read') {
    const r = ev.reading, diff = r.differs_from_reference;
    EVN[ev.evidence_id] = ev.face ? `${ev.face} 사진` : '사진';
    tick('read', `판독${ev.face ? ' (' + ev.face + ')' : ''}`, ev.t ?? 0);
    READS.push(shot(ev.photo, ev.face ? ev.face + ' 사진' : '받은 사진', ev.reference, diff === true ? 'bad' : diff === false ? 'ok' : '',
                    r.observation + (ev.reference && r.reference_difference ? ' ' + r.reference_difference : '')));
    $('stage').innerHTML = `<h2 class="stage-h">사진 판독</h2><div class="shots">${READS.join('')}</div>`;
    setState('다시 판단하는 중');
    return;
  }
  if (ev.type === 'photo_timeout') {
    $('stage').innerHTML = `<h2 class="stage-h">사진 없음</h2><div class="note">가진 기록만으로 결론을 냅니다.</div>`;
    return;
  }
  if (ev.type === 'final') {
    renderHyps(ev.hypotheses); setState('');
    const top = (ev.hypotheses || []).slice().sort((a, b) => b.score - a.score)[0];
    const title = top ? koLabel(top.statement) : '결론 없음';
    const [cls, word] = stampOf(title);
    $('final').innerHTML = `<h3>결론</h3><div class="verdict">
        <div class="stamp ${cls}"><div class="w">${word}</div><div class="c">확신 ${Math.round((ev.confidence || 0) * 100)}%</div></div>
        <div class="title">${title}</div></div>
      <div class="note">${more(ev.root_cause || ev.status)}</div>
      <div class="cites">${(ev.cited || []).map(c => `<span title="${esc(c)}">${esc(evName(c))}</span>`).join('')}</div>`;
    $('final').classList.remove('hidden');
    return;
  }
  if (ev.type === 'error') {
    $('final').classList.remove('hidden'); $('final').innerHTML = `<h3>오류</h3><div class="note">${esc(ev.message)}</div>`;
  }
}

// 재생 파일에는 QR 대신 작업자 휴대폰에 뜨는 화면(app/templates/mobile.html 과 같은 내용)을 이 요청 그대로 그린다
function phone(reqs){
  return `<div class="phone"><div class="bar"></div><div class="t">RootCause Stream</div>
    ${(reqs || []).map(r => `<div class="r">${esc(r.target)}</div>`).join('')}<div class="go">촬영하기</div></div>`;
}

function renderHyps(hs){
  (hs || []).forEach(h => { const n = shortName(h.statement); if (n) HN[h.id] = n; });
  const list = (hs || []).slice().sort((a, b) => b.score - a.score).slice(0, 4);
  const best = list.length ? list[0].score : 0;
  $('hyps').innerHTML = list.map(h => {
    const prev = lastScores[h.id], d = prev === undefined ? 0 : h.score - prev;
    const delta = Math.abs(d) < .02 ? '' : d > 0 ? ` <span class="up">▲${Math.round(d * 100)}</span>` : ` <span class="down">▼${Math.round(-d * 100)}</span>`;
    return `<div class="hyp ${h.score === best && best > 0 ? 'lead' : ''}" onclick="this.classList.toggle('open')" title="${esc(h.id)}">
      <span class="n">${esc(HN[h.id] || h.statement)}</span><span class="p">${Math.round(h.score * 100)}%${delta}</span>
      <div class="meter"><i style="width:${(prev ?? 0) * 100}%" data-w="${h.score * 100}"></i></div>
      <div class="full">${esc(h.statement)}</div></div>`;
  }).join('');
  requestAnimationFrame(() => document.querySelectorAll('.meter i').forEach(b => b.style.width = b.dataset.w + '%'));
  (hs || []).forEach(h => lastScores[h.id] = h.score);
}

// ── 라이브 시연: 휴대폰이 없을 때 준비된 사진으로 응답 ──
async function loadDemo(){
  const d = await (await fetch(`/api/sessions/${sid}/demo_photos`)).json();
  const f = d.options.find(o => o.shows === 'this_weld'), b = d.options.find(o => o.shows === 'this_weld_back');
  const both = (f && b) ? `<button onclick='useDemoMany(${JSON.stringify([f.path, b.path])})'><div style="display:flex"><img src="${photoURL(f.path)}" style="width:55px"><img src="${photoURL(b.path)}" style="width:55px"></div>앞면과 뒷면</button>` : '';
  $('demoOpts').innerHTML = both + d.options.map(o => `<button onclick='useDemo(${JSON.stringify(o.path)})'><img src="${photoURL(o.path)}">${esc(o.key)}</button>`).join('')
    + `<button class="flat" onclick="noPhoto()">사진 없이 진행</button>`;
}
async function useDemo(path){ await fetch(`/api/sessions/${sid}/demo_photo`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path})}); }
async function useDemoMany(paths){ await fetch(`/api/sessions/${sid}/demo_photo`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({paths})}); }
async function noPhoto(){ await fetch(`/api/sessions/${sid}/no_photo`, {method:'POST'}); }

// ── 녹화 재생: 실제 실행의 이벤트를 '보여주는 시점'만 압축해 재생한다. 배지와 시간 막대는 실제 경과 시간 ──
//   /?replay=e323-ko  (기본 4배속, 이벤트 사이 최대 3.5초)   /?replay=e323-ko&speed=6&cap=2.5   /?case=E-323&autostart=1
let PLAY = 0;
async function replay(name, speed, cap){
  let run;
  if (EMBED) run = EMBED.runs[name];
  else {
    const r = await fetch(`/api/demo_runs/${encodeURIComponent(name)}`);
    if (!r.ok) { $('stage').textContent = `재생 기록 '${name}' 이 없습니다`; return; }
    run = await r.json();
  }
  const evs = run.events;
  $('gateInfo').textContent = `${run.meta.case_id}, 실제 소요 ${fmt(evs[evs.length-1].t - evs[0].t)}`;
  $('replayGate').classList.remove('hidden');
  await new Promise(res => {
    const go = () => { $('replayGate').classList.add('hidden'); removeEventListener('keydown', key); res(); };
    const key = e => { if (e.code === 'Space') { e.preventDefault(); go(); } };
    $('replayGate').onclick = go; addEventListener('keydown', key);
  });
  playRun(run, speed, cap);
}
async function playRun(run, speed, cap){
  const my = ++PLAY; REPLAY = run;
  const evs = run.events, t0 = evs[0].t, total = evs[evs.length-1].t - t0;
  resetUI(run.meta.case_id); TMAX = total || 60;
  $('equip').classList.add('hidden');
  const badge = $('replayBadge'); badge.classList.remove('hidden');
  const setBadge = t => { badge.innerHTML = `실제 실행 기록 재생 <i>${fmt(t)} / ${fmt(total)}</i>`; playhead(t); };
  setBadge(0);
  let shown = 0;
  for (let i = 0; i < evs.length; i++) {
    const gap = i ? (evs[i].t - evs[i-1].t) : 0, wait = Math.min(gap / speed, cap) * 1000;
    const tk = setInterval(() => { shown = Math.min(shown + speed * 0.25, evs[i].t - t0); if (my === PLAY) setBadge(shown); }, 250);
    await new Promise(res => setTimeout(res, wait));
    clearInterval(tk);
    if (my !== PLAY) return;
    shown = evs[i].t - t0; setBadge(shown);
    handle(evs[i]);
  }
}

const P = new URLSearchParams(location.search);
if (EMBED) {
  const names = EMBED.order || Object.keys(EMBED.runs);
  $('equip').classList.add('hidden');
  if (names.length === 1) replay(names[0], +(P.get('speed') || 4), +(P.get('cap') || 3.5));
}
else if (P.get('replay')) replay(P.get('replay'), +(P.get('speed') || 4), +(P.get('cap') || 3.5));
else if (P.get('case') && P.get('autostart')) start(P.get('case'));
</script>
