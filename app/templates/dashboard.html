<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RootCause Stream</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- 디자인 (2026-11-22, 발표자료 v3 와 한 세트): 어두운 관제실 + 강조색 하나(용접 불꽃 주황).
     청록 = AI 가 생각·판단, 보라 = 사람·사진. 처음 보는 사람을 위해 위쪽에 진행 단계 표시줄을 둔다. -->
<style>
  /* 참고 디자인 (Behance 2026-11-22): ORYN — ■ 표식·격자, Orbit — 실행 기록(run trace)·얇고 큰 숫자, Tensora — 두 톤 제목 */
  /* 추가 참고 (Behance 2026-11-22): ECO Mine — 레이더 원 · 진행 중인 것에 빛, Cybersecurity — 카드 뒤 빛 번짐, Keel — 숫자 옆 그래프 */
  body{font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;background:#0E1116;
       background-image:radial-gradient(1100px 520px at 12% -8%,rgba(255,106,43,.11),transparent 62%),
         radial-gradient(900px 520px at 100% 105%,rgba(109,93,246,.10),transparent 60%),
         linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
       background-size:auto,auto,48px 48px,48px 48px;background-attachment:fixed}
  .card{transition:box-shadow .7s ease,border-color .7s ease}
  .live{border-color:rgba(255,106,43,.55)!important;box-shadow:0 0 0 1px rgba(255,106,43,.35),0 0 70px -8px rgba(255,106,43,.38)}
  .live-p{border-color:rgba(139,124,255,.7)!important;box-shadow:0 0 0 1px rgba(139,124,255,.45),0 0 80px -6px rgba(139,124,255,.45)}
  .scan::after{content:"";position:absolute;left:0;right:0;height:26%;top:-26%;
    background:linear-gradient(180deg,transparent,rgba(169,156,255,.55) 45%,rgba(255,255,255,.75) 50%,rgba(169,156,255,.55) 55%,transparent);
    animation:scan 1.5s linear infinite}
  @keyframes scan{to{top:100%}}
  .ping{position:absolute;left:50%;top:50%;width:46%;height:46%;border:3px solid #FF6A2B;border-radius:50%;
    transform:translate(-50%,-50%);animation:ping 1.8s ease-out infinite}
  .hold{position:absolute;left:50%;top:50%;width:46%;height:46%;border:2px solid rgba(255,106,43,.9);border-radius:50%;
    transform:translate(-50%,-50%);box-shadow:0 0 24px rgba(255,106,43,.6)}
  @keyframes ping{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}100%{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
  .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.8s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .gauge{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
  .tag{font-size:11px;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
  .tag::before{content:"■ ";}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .dim{color:#6B7280}
  .bar{transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%{background:rgba(255,106,43,.18)}100%{background:transparent}}
  .pulse{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .glow{box-shadow:0 0 0 1px rgba(139,124,255,.55),0 10px 40px -10px rgba(139,124,255,.45)}
  .glow-o{box-shadow:0 0 0 1px rgba(255,106,43,.6),0 10px 40px -12px rgba(255,106,43,.5)}
  details summary{cursor:pointer}
</style>
</head>
<body class="text-[#E6E8EB] min-h-screen">
<header class="px-6 py-4 flex items-center gap-4 border-b border-[#232933] bg-[#0E1116]/95 sticky top-0 z-40">
  <div class="flex items-center gap-2">
    <span class="w-3 h-3 rounded-full bg-[#FF6A2B] shadow-[0_0_12px_#FF6A2B]"></span>
    <span class="font-extrabold text-lg tracking-tight">RootCause Stream</span>
  </div>
  <div id="replayBadge" class="hidden ml-auto text-xs bg-[#FF6A2B] text-white font-semibold rounded-full px-3 py-1.5"></div>
  <div class="ml-auto text-xs text-[#8A93A0] border border-[#2A313C] rounded-full px-3 py-1.5" id="equip">진단 {{model}} · 사진 판독 {{vlm}}</div>
</header>

<div id="replayGate" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center cursor-pointer">
  <div class="bg-[#161A21] border border-[#2A313C] rounded-2xl px-12 py-10 text-center glow-o">
    <div class="text-xs font-bold tracking-widest text-[#FF6A2B]">REPLAY</div>
    <div class="text-2xl font-extrabold mt-2">실제 실행 기록 재생</div>
    <div id="gateInfo" class="text-sm text-[#8A93A0] mt-2"></div>
    <div class="mt-6 text-sm text-[#C9CDD2]">화면 녹화를 시작한 뒤 <b class="text-white">클릭</b> 또는 <b class="text-white">스페이스</b></div>
  </div>
</div>


<main class="grid grid-cols-12 gap-5 p-6">
  <!-- 사건 목록 -->
  <aside class="col-span-3 space-y-2">
    <div class="tag text-[#8A93A0] px-1 mb-2">사건 목록</div>
    {% for c in cases %}
    <button onclick="start('{{c.id}}')" id="case-{{c.id}}"
      class="case w-full text-left bg-[#161A21] border border-[#232933] rounded-2xl px-4 py-3 hover:border-[#FF6A2B]/60 transition">
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full
          {% if c.tier=='E' %}bg-[#FF6A2B]/15 text-[#FF8A55]{% elif c.tier=='D' %}bg-[#8B7CFF]/15 text-[#A99CFF]{% elif c.tier=='C' %}bg-[#FF5A5A]/15 text-[#FF8080]
          {% elif c.tier=='A' %}bg-[#F5B547]/15 text-[#F5C46A]{% else %}bg-[#2A313C] text-[#9AA3AE]{% endif %}">{{c.tier}}</span>
        <span class="font-semibold text-sm">{{c.id}}</span>
        <span class="ml-auto text-[11px] text-[#5C6573]">{% if c.tier=='E' %}용접 1회 판정{% else %}{{ {'level_shift': '수준 이동', 'burst': '알람 폭주'}.get(c.kind, c.kind) }} · 알람 {{c.alarms}}{% endif %}</span>
      </div>
      <div class="text-xs text-[#8A93A0] mt-1.5">{{c.blurb}}</div>
    </button>
    {% endfor %}
  </aside>

  <!-- 가운데: 사건 · 가설 · 사진 · 결론 -->
  <section class="col-span-6 space-y-5">
    <div id="incident" class="card bg-[#161A21] border border-[#232933] rounded-2xl p-6 text-[#8A93A0] text-sm">
      —
    </div>

    <div id="hypsCard" class="card bg-[#161A21] border border-[#232933] rounded-2xl p-6">
      <div class="flex items-center mb-4">
        <div>
          <div class="tag text-[#19C2A8]">AI 의 가설</div>
        </div>
        <div id="status" class="ml-auto text-xs text-[#8A93A0]"></div>
      </div>
      <div id="hyps" class="space-y-4 text-sm text-[#8A93A0]">—</div>
    </div>

    <div id="photoPanel" class="card hidden bg-[#17152A] border border-[#3A3370] rounded-2xl p-6"></div>
    <div id="final" class="hidden"></div>
  </section>

  <!-- 오른쪽: 추론 과정 -->
  <section class="col-span-3">
    <div class="bg-[#161A21] border border-[#232933] rounded-2xl p-6 sticky top-24">
      <div class="tag text-[#8A93A0]">실행 기록</div>
      <div class="mb-4"></div>
      <ol id="trace" class="space-y-1 text-[11px]"></ol>
    </div>
  </section>
</main>

<script>
let es = null, sid = null, lastScores = {}, REPLAY = null, READS = [], T0 = null, TPREV = null;   // READS: 이번 촬영 요청에 온 판독들
// 서버 없이 여는 내보내기 파일(scripts/export_replay_html.py)은 녹화 기록과 사진을 페이지 안에 싣는다
const EMBED = window.__EMBED__ || null;
const photoURL = p => (EMBED && EMBED.photos[p]) || `/photo?path=${encodeURIComponent(p)}`;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOOL_KO = {search_manual: '매뉴얼 검색', lookup_diagram: '도면 찾기', query_timeseries: '공정 기록 조회',
                 recall_cases: '과거 사례 찾기', query_sql: '기록 직접 질의'};

// 지금 바뀐 부분이 화면 밖이면 그쪽으로 부드럽게 내려간다 (녹화할 때 손으로 스크롤하지 않게)
function focusOn(id){ requestAnimationFrame(() => $(id)?.scrollIntoView({behavior: 'smooth', block: 'center'})); }
// 결론 제목 — 처음 보는 사람을 위해 우리말 이름을 앞에 붙인다 (AI 의 원문은 그대로 둔다)
function koLabel(stmt){
  const t = String(stmt || '');
  if (/[가-힣]/.test(t)) return esc(t.split(/[.:(—]/)[0].trim());     // 이미 한국어로 답한 경우
  const name = /expulsion|splash/i.test(t) ? '날림' : /acceptable|no (visible )?defect|no defect/i.test(t) ? '정상 용접'
    : /burn-through/i.test(t) ? '용락(구멍)' : /cold|undersized|missing nugget/i.test(t) ? '용융 부족'
    : /misalign|off-centre|off-center/i.test(t) ? '전극 정렬 불량' : /data|acquisition|record/i.test(t) ? '데이터 수집 이상' : '';
  const en = t.split(/[.:—(]/)[0].trim();
  return name ? `${name} <span class="text-base font-semibold text-[#8A93A0]">${esc(en)}</span>` : esc(en);
}
// 지금 진행 중인 카드에만 빛을 둔다 (보라 = 사람·사진)
function setLive(id, purple){
  ['incident', 'hypsCard', 'photoPanel', 'final'].forEach(k => $(k)?.classList.remove('live', 'live-p'));
  $(id)?.classList.add(purple ? 'live-p' : 'live');
}
// 용접 중 측정한 전류를 선 그래프로 (최대값에 점)
function wave(vals){
  if (!vals || vals.length < 2) return '';
  const W = 600, H = 96, pad = 10, lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const pts = vals.map((v, i) => [pad + i * (W - 2 * pad) / (vals.length - 1), H - pad - (v - lo) / span * (H - 2 * pad)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const mx = pts[vals.indexOf(hi)];
  return `<div class="mt-4 bg-[#1D222B] rounded-2xl px-4 pt-3 pb-2">
    <div class="flex items-baseline justify-between"><span class="text-[11px] text-[#8A93A0]">전류 파형</span>
      <span class="mono text-[11px] text-[#5C6573]">${Math.round(lo).toLocaleString()} – ${Math.round(hi).toLocaleString()} A</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="w-full h-24 mt-1" preserveAspectRatio="none">
      <defs><linearGradient id="wf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6A2B" stop-opacity=".35"/><stop offset="1" stop-color="#FF6A2B" stop-opacity="0"/></linearGradient></defs>
      <path d="${line} L${pts[pts.length - 1][0]} ${H} L${pts[0][0]} ${H} Z" fill="url(#wf)"/>
      <path d="${line}" fill="none" stroke="#FF6A2B" stroke-width="2.5" stroke-linejoin="round" class="draw" vector-effect="non-scaling-stroke"/>
      <circle cx="${mx[0]}" cy="${mx[1]}" r="5" fill="#FF6A2B"/><circle cx="${mx[0]}" cy="${mx[1]}" r="11" fill="#FF6A2B" fill-opacity=".25"/>
    </svg></div>`;
}
// 확신 원형 게이지
function gauge(c){
  const r = 38, L = 2 * Math.PI * r, v = Math.max(0, Math.min(1, c || 0));
  setTimeout(() => { const g = $('gaugeArc'); if (g) g.style.strokeDashoffset = L * (1 - v); }, 60);
  return `<div class="relative w-28 h-28 shrink-0">
    <svg viewBox="0 0 100 100" class="w-28 h-28 -rotate-90">
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="#2A2320" stroke-width="9"/>
      <circle id="gaugeArc" cx="50" cy="50" r="${r}" fill="none" stroke="#FF6A2B" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${L}" stroke-dashoffset="${L}" class="gauge" style="filter:drop-shadow(0 0 6px rgba(255,106,43,.7))"/></svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center">
      <div class="text-3xl font-light tracking-tight text-[#FF6A2B]">${Math.round(v * 100)}<span class="text-sm">%</span></div>
      <div class="text-[10px] text-[#8A93A0] -mt-0.5">확신</div></div></div>`;
}
function setStatus(text, color, pulse){
  $('status').textContent = text;
  $('status').className = `ml-auto text-xs font-semibold rounded-full px-3 py-1.5 border ${color} ${pulse ? 'pulse' : ''}`;
}

// 실행 기록 한 줄: 시각(사건 시작부터) · 한 일 · 앞 줄부터 걸린 시간 막대 (30초 = 가득)
const KIND = {tool: ['#19C2A8', 'TOOL'], ask: ['#8B7CFF', 'ASK'], human: ['#8B7CFF', 'HUMAN'], read: ['#A99CFF', 'VLM'], done: ['#FF6A2B', 'DONE'], llm: ['#5C6573', 'LLM']};
function trace(kind, label, t, sub){
  if (T0 === null) T0 = t;
  const dt = TPREV === null ? 0 : Math.max(0, t - TPREV); TPREV = t;
  const [col, tagname] = KIND[kind] || KIND.llm;
  const el = (t - T0), mm = `${Math.floor(el/60)}:${String(Math.floor(el%60)).padStart(2,'0')}`;
  const li = document.createElement('li');
  li.className = 'grid grid-cols-[38px_44px_1fr] items-center gap-2 rounded-lg px-2 py-1.5 flash';
  li.innerHTML = `<span class="mono text-[#5C6573]">${mm}</span>
    <span class="mono text-[9px] font-bold rounded px-1 py-0.5 text-center" style="color:${col};background:${col}22">${tagname}</span>
    <span class="min-w-0"><span class="block truncate text-[12px] text-[#E6E8EB]">${esc(label)}</span>
      <span class="flex items-center gap-2 mt-1"><span class="h-1 rounded-full" style="background:${col};width:${Math.max(4, Math.min(100, dt / 30 * 100))}%"></span>
      <span class="mono text-[#5C6573] shrink-0">${dt.toFixed(1)}s</span></span>
      ${sub ? `<span class="block truncate text-[#5C6573] mt-0.5">${esc(sub)}</span>` : ''}</span>`;
  $('trace').appendChild(li);
}

function resetUI(caseId){
  if (es) es.close();
  document.querySelectorAll('.case').forEach(b => b.classList.remove('glow-o'));
  $('case-'+caseId)?.classList.add('glow-o');
  $('trace').innerHTML = ''; T0 = null; TPREV = null;
  $('hyps').innerHTML = '<div class="pulse text-[#8A93A0]">가설을 세우는 중…</div>';
  $('photoPanel').classList.add('hidden'); $('final').classList.add('hidden');
  lastScores = {}; }

async function start(caseId){
  // 내보낸 재생 파일: 누른 사건의 실제 실행 기록을 재생한다 (재생 중이면 그 사건으로 바로 넘어간다)
  if (EMBED) {
    const run = Object.values(EMBED.runs || {}).find(r => r.meta.case_id === caseId);
    if (run) playRun(run, +(P.get('speed') || 4), +(P.get('cap') || 3.5));
    return;
  }
  if (REPLAY) return;                       // 재생 중에는 새 진단을 시작하지 않는다
  resetUI(caseId);
  const r = await fetch('/api/sessions', {method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({case_id: caseId})});
  sid = (await r.json()).session_id;
  setStatus('AI 가 생각하는 중', 'text-[#19C2A8] border-[#19C2A8]/40', true);
  es = new EventSource(`/api/sessions/${sid}/stream`);
  es.onmessage = e => handle(JSON.parse(e.data));
  es.addEventListener('end', () => es.close());
}

function metric(label, value, unit, d){
  const out = d && d.p10 !== undefined && (value < d.p10 || value > d.p90);
  return `<div class="bg-[#1D222B] rounded-2xl px-4 py-3">
    <div class="text-[11px] text-[#8A93A0]">${label}</div>
    <div class="text-4xl font-light tracking-tight mt-1">${Math.round(value).toLocaleString()}<span class="text-sm font-semibold text-[#8A93A0] ml-1">${unit}</span></div>
    ${d && d.p10 !== undefined ? `<div class="text-[11px] mt-1 ${out ? 'text-[#F5B547] font-semibold' : 'text-[#19C2A8]'}">${out ? '보통 범위 끝자락' : '보통 범위'} · ${Math.round(d.p10).toLocaleString()}–${Math.round(d.p90).toLocaleString()}</div>` : ''}
  </div>`;
}

function handle(ev){
  if (ev.type === 'incident' && ev.kind === 'weld_quality') {
    const s = ev.summary || {}, sp = s.setpoints || {}, lg = s.logged_during_weld || {}, pop = s.same_setpoint_population || {};
    trace('llm', '사건 접수 · 가설 세우기', ev.t ?? 0);
    $('incident').className = 'card bg-[#161A21] border border-[#232933] rounded-2xl p-6';
    $('incident').innerHTML = `<div class="flex items-baseline gap-3 flex-wrap">
        <div class="tag text-[#FF6A2B]">사건</div>
        <div class="text-2xl font-extrabold mono">${esc(ev.case_id)}</div>
        </div>
      <div class="text-xs text-[#5C6573] mt-1">${/RSW-LAB/.test(s.machine || '') ? '실험실 점용접기 (RSW-LAB)' : esc(s.machine || '')} · ${esc(String(s.material || '').replace('carbon steel', '탄소강'))} · 설정 공압 ${sp.air_pressure_psi} psi · 통전 ${sp.weld_time_ms} ms</div>
      <div class="grid grid-cols-3 gap-3 mt-4">
        ${metric('최대 전류', lg.peak_current_A, 'A', pop.peak_current_A)}
        ${metric('평균 전류', lg.mean_current_A, 'A', pop.mean_current_A)}
        ${metric('누르는 힘', lg.peak_force_N, 'N', pop.peak_force_N)}
      </div>${wave(lg.current_A)}`;
    $('incident').classList.add('card'); setLive('incident');
    return;
  }
  if (ev.type === 'incident') {
    trace('llm', '사건 접수 · 가설 세우기', ev.t ?? 0);
    const kind = ev.kind === 'level_shift' ? '<span class="text-[#F5C46A] font-semibold">수준 이동</span>'
                                           : '<span class="text-[#FF8080] font-semibold">알람 폭주</span>';
    $('incident').className = 'card bg-[#161A21] border border-[#232933] rounded-2xl p-6';
    $('incident').innerHTML = `<div class="flex items-baseline gap-3"><div class="tag text-[#FF6A2B]">사건</div>
      <div class="text-2xl font-extrabold">${esc(ev.case_id)}</div><div class="text-sm">알람 <b>${ev.alarm_count}</b>건</div></div>
      <div class="text-sm mt-2 text-[#C9CDD2]">${kind}</div>
      <div class="text-xs text-[#5C6573] mt-1">${esc((ev.window||[]).join(' → '))}</div>`;
    setLive('incident');
  }
  if (ev.type === 'step') {
    renderHyps(ev.hypotheses); if (ev.action !== 'request_photo') setLive('hypsCard');
    const label = ev.action === 'use_tool' ? (TOOL_KO[ev.tool] || ev.tool)
                : ev.action === 'request_photo' ? '작업자에게 촬영 요청' : ev.action === 'finalize' ? '결론' : ev.action;
    const kind = ev.action === 'use_tool' ? 'tool' : ev.action === 'request_photo' ? 'ask' : ev.action === 'finalize' ? 'done' : 'llm';
    trace(kind, label, ev.t ?? 0, ev.evidence ? `[${ev.evidence.id}] ${ev.evidence.summary}` : `AI 호출 ${ev.usage?.calls}회`);
  }
  if (ev.type === 'photo_request') {
    READS = []; renderHyps(ev.hypotheses);
    setStatus('⏸ 작업자의 사진을 기다리는 중', 'text-[#A99CFF] border-[#8B7CFF]/50', true);
    const reqs = ev.requests.map(r => `
      <div class="bg-[#1F1C38] rounded-2xl p-4 mb-3">
        <div class="font-bold text-base">📷 ${esc(r.target)}</div>
        <div class="text-xs text-[#A9A3D6] mt-1">${esc(r.how_to_shoot)}</div>
        <div class="text-sm mt-2 text-[#DAD6F7]"><b class="text-white">왜 필요한가</b> ${esc(r.why_this_photo)}</div>
      </div>`).join('');
    $('photoPanel').innerHTML = `
      <div class="tag text-[#A99CFF]">사람에게 묻기</div>
      <div class="text-xl font-extrabold mt-1 mb-4">촬영 요청</div>
      <div class="flex gap-5">
        <div class="flex-1">${reqs}</div>
        <div class="w-48 text-center shrink-0">
          ${REPLAY ? `<div class="w-44 h-44 mx-auto rounded-2xl bg-[#1F1C38] border-2 border-dashed border-[#5B51A8] flex items-center justify-center text-xs text-[#A99CFF] p-4">QR</div>`
                   : `<img src="/qr/${ev.token}.png" class="w-44 mx-auto rounded-2xl bg-white p-2">`}
          <div class="text-[10px] text-[#6E6A92] break-all mt-1">${esc(ev.upload_url)}</div>
        </div>
      </div>
      ${REPLAY ? '' : `
      <div class="mt-2 pt-3 border-t border-[#3A3370]">
        <div class="text-xs text-[#A9A3D6] mb-2">휴대폰이 없으면 — 준비된 사진으로 응답</div>
        <div id="demoOpts" class="flex gap-2 flex-wrap"></div>
        <button onclick="noPhoto()" class="mt-3 text-xs text-[#8A93A0] underline">사진 없이 진행 (응답 없음 경로)</button>
      </div>`}`;
    $('photoPanel').classList.remove('hidden'); setLive('photoPanel', true); focusOn('photoPanel');
    if (!REPLAY) loadDemo();
  }
  if (ev.type === 'photo_received') {
    trace('human', `사진 도착${ev.face ? ' · ' + ev.face : ''}`, ev.t ?? 0);
    setStatus('🔍 사진을 읽는 중', 'text-[#A99CFF] border-[#8B7CFF]/50', true);
    $('photoPanel').innerHTML = panelHead() + READS.join('') + `<div class="pulse text-[#DAD6F7] font-semibold ${READS.length ? 'mt-4 pt-4 border-t border-[#3A3370]' : ''}">
      사진 도착${ev.face ? ' (' + esc(ev.face) + ')' : ''}</div>
      <div class="flex gap-3 mt-3">${photoFig(ev.photo, '받은 사진' + (ev.face ? ' · ' + ev.face : ''), true, 'scan')}${ev.reference ? photoFig(ev.reference, '합격품 (같은 설정)', false, 'scan') : ''}</div>`;
    setLive('photoPanel', true); focusOn('photoPanel');
  }
  if (ev.type === 'photo_read') {
    const r = ev.reading;
    trace('read', `판독${ev.face ? ' · ' + ev.face : ''} — ${r.differs_from_reference === true ? '합격품과 다름' : r.differs_from_reference === false ? '합격품과 비슷' : '판독 완료'}`, ev.t ?? 0, `[${ev.evidence_id}]`);
    const diff = r.differs_from_reference;
    const verdict = ev.reference ? (diff === true
        ? '<span class="text-[11px] font-bold rounded-full px-2.5 py-1 bg-[#FF5A5A]/15 text-[#FF8080]">합격품과 다름 — 불량 흔적</span>'
        : diff === false ? '<span class="text-[11px] font-bold rounded-full px-2.5 py-1 bg-[#19C2A8]/15 text-[#5FE0CB]">합격품과 비슷함</span>'
        : '<span class="text-[11px] font-bold rounded-full px-2.5 py-1 bg-[#2A313C] text-[#9AA3AE]">판단 불가</span>') : '';
    const card = `<div class="flex gap-5 ${READS.length ? 'mt-4 pt-4 border-t border-[#3A3370]' : ''}">
      <div class="flex gap-2 shrink-0">${photoFig(ev.photo, '받은 사진' + (ev.face ? ' · ' + ev.face : ''), diff === true, diff === true ? 'defect' : null)}${ev.reference ? photoFig(ev.reference, '합격품') : ''}</div>
      <div class="text-sm min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="font-bold text-white">판독 [${esc(ev.evidence_id)}]${ev.face ? ' · ' + esc(ev.face) : ''}</span>${verdict}</div>
        <div class="mt-2 text-[#DAD6F7]">${esc(r.observation)}</div>
        ${ev.reference && r.reference_difference ? `<div class="mt-1 text-xs text-[#A9A3D6]">${esc(r.reference_difference)}</div>` : ''}
      </div></div>`;
    READS.push(card);
    $('photoPanel').innerHTML = panelHead() + READS.join('');
    focusOn('photoPanel');
    setStatus('AI 가 다시 판단하는 중', 'text-[#19C2A8] border-[#19C2A8]/40', true);
  }
  if (ev.type === 'photo_timeout') {
    $('photoPanel').innerHTML = '<div class="text-[#A9A3D6] text-sm">사진 없이 진행합니다 — 가진 증거만으로 결론을 냅니다.</div>';
  }
  if (ev.type === 'final') {
    renderHyps(ev.hypotheses);
    setStatus(`완료 · ${ev.steps}단계`, 'text-[#FF8A55] border-[#FF6A2B]/50', false);
    const top = (ev.hypotheses || []).slice().sort((a, b) => b.score - a.score)[0];
    $('final').className = 'card bg-[#1E1612] border border-[#FF6A2B]/60 rounded-2xl p-6';
    $('final').innerHTML = `<div class="flex items-center gap-5">
        <div class="flex-1 min-w-0"><div class="tag text-[#FF6A2B]">결론</div>
          <div class="text-3xl font-extrabold mt-2">${top ? koLabel(top.statement) : '결론'}</div></div>
        ${gauge(ev.confidence)}
      </div>
      <div class="mt-3 text-sm text-[#C9CDD2] leading-relaxed">${esc(ev.root_cause || '결론 없음 — ' + ev.status)}</div>
      <div class="flex gap-2 mt-4 flex-wrap" id="finalEnd">${(ev.cited||[]).map(c => `<span class="text-[11px] font-semibold rounded-full px-2.5 py-1 bg-[#FF6A2B]/15 text-[#FF8A55]">근거 ${esc(c)}</span>`).join('')}
        <span class="text-[11px] rounded-full px-2.5 py-1 bg-[#2A313C] text-[#9AA3AE]">AI 호출 ${ev.usage?.calls}회</span></div>`;
    setLive('final'); focusOn('final');
  }
  if (ev.type === 'error') {
    $('final').className = 'bg-[#2A1414] border border-[#FF5A5A]/50 rounded-2xl p-6 text-sm';
    $('final').textContent = '오류: ' + ev.message;
  }
}

function panelHead(){
  return `<div class="tag text-[#A99CFF]">사진 판독</div>
    <div class="mb-4"></div>`;
}
const CORNERS = ['top-2 left-2 border-t-2 border-l-2', 'top-2 right-2 border-t-2 border-r-2',
                 'bottom-2 left-2 border-b-2 border-l-2', 'bottom-2 right-2 border-b-2 border-r-2'];
function photoFig(path, label, hot, mode){
  const col = mode === 'defect' ? 'border-[#FF6A2B]' : 'border-[#A99CFF]';
  const corners = mode ? CORNERS.map(c => `<span class="absolute w-6 h-6 ${c} ${col}"></span>`).join('') : '';
  return `<figure class="w-44"><div class="relative w-44 h-44 rounded-2xl overflow-hidden ${mode === 'scan' ? 'scan' : ''} ${hot ? 'ring-2 ring-[#FF6A2B]' : 'ring-1 ring-[#3A3370]'}">
      <img src="${photoURL(path)}" class="w-full h-full object-cover">${corners}
      ${mode === 'defect' ? '<span class="ping"></span><span class="hold"></span>' : ''}</div>
    <figcaption class="text-[11px] text-[#A9A3D6] mt-1.5">${esc(label)}</figcaption></figure>`;
}

function renderHyps(hs){
  const sorted = (hs||[]).slice(0,4);
  const best = Math.max(...sorted.map(h => h.score), 0);
  $('hyps').innerHTML = sorted.map(h => {
    const prev = lastScores[h.id]; const d = prev === undefined ? 0 : h.score - prev;
    const arrow = Math.abs(d) < .02 ? '' : (d > 0 ? `<span class="text-[#5FE0CB] text-xs">▲${d.toFixed(2)}</span>`
                                                   : `<span class="text-[#FF8080] text-xs">▼${(-d).toFixed(2)}</span>`);
    const lead = h.score === best && best > 0;
    return `<div><div class="flex gap-3 items-start">
        <span class="text-xs font-bold rounded-lg px-2 py-1 ${lead ? 'bg-[#FF6A2B] text-white' : 'bg-[#2A313C] text-[#9AA3AE]'}">${esc(h.id)}</span>
        <span class="flex-1 ${lead ? 'text-[#F3F4F6]' : 'text-[#9AA3AE]'}">${esc(h.statement)}</span>
        <span class="font-mono text-lg font-bold ${lead ? 'text-[#FF6A2B]' : 'text-[#8A93A0]'}">${h.score.toFixed(2)}</span> ${arrow}</div>
      <div class="h-2 bg-[#1D222B] rounded-full mt-2"><div class="bar h-2 rounded-full ${lead ? 'bg-[#FF6A2B]' : 'bg-[#3A424E]'}"
        style="width:${(prev??0)*100}%" data-w="${h.score*100}"></div></div>
      <div class="text-[11px] text-[#5C6573] mt-1">근거 ${esc((h.cited||[]).join(', ')||'—')}</div></div>`;
  }).join('');
  requestAnimationFrame(() => document.querySelectorAll('.bar').forEach(b => b.style.width = b.dataset.w + '%'));
  (hs||[]).forEach(h => lastScores[h.id] = h.score);
}

async function loadDemo(){
  const r = await fetch(`/api/sessions/${sid}/demo_photos`); const d = await r.json();
  const f = d.options.find(o => o.shows === 'this_weld'), b = d.options.find(o => o.shows === 'this_weld_back');
  const btn = 'bg-[#1F1C38] border border-[#3A3370] rounded-xl p-1.5 hover:border-[#8B7CFF] text-left w-32';
  const both = (f && b) ? `<button onclick='useDemoMany(${JSON.stringify([f.path, b.path])})' class="${btn}">
      <div class="flex gap-0.5"><img src="${photoURL(f.path)}" class="w-1/2 h-20 object-cover rounded-lg"><img src="${photoURL(b.path)}" class="w-1/2 h-20 object-cover rounded-lg"></div>
      <div class="text-[10px] text-[#DAD6F7] mt-1">이 용접 · 앞면 + 뒷면</div></button>` : '';
  $('demoOpts').innerHTML = both + d.options.map(o => `
    <button onclick='useDemo(${JSON.stringify(o.path)})' class="${btn}">
      <img src="${photoURL(o.path)}" class="w-full h-20 object-cover rounded-lg">
      <div class="text-[10px] text-[#DAD6F7] mt-1">${esc(o.key)}</div></button>`).join('');
}
async function useDemo(path){
  await fetch(`/api/sessions/${sid}/demo_photo`, {method:'POST', headers:{'Content-Type':'application/json'},
                                                  body: JSON.stringify({path})});
}
async function useDemoMany(paths){
  await fetch(`/api/sessions/${sid}/demo_photo`, {method:'POST', headers:{'Content-Type':'application/json'},
                                                  body: JSON.stringify({paths})});
}
async function noPhoto(){ await fetch(`/api/sessions/${sid}/no_photo`, {method:'POST'}); }

// ── 녹화용 재생 ────────────────────────────────────────────────
// scripts/record_demo.py 가 저장한 실제 실행의 이벤트를 '보여주는 시점'만 압축해 재생한다.
// 내용은 그대로이고, 배지에 실제 경과 시간을 함께 띄운다.
//   /?replay=e323-faces            (기본: 4배속, 이벤트 사이 최대 3.5초)
//   /?replay=e323-faces&speed=6&cap=2.5
//   /?case=E-323&autostart=1       (라이브로 바로 시작)
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
let PLAY = 0;                               // 재생 회차 — 다른 사건을 누르면 앞 재생을 멈춘다
async function replay(name, speed, cap){
  let run;
  if (EMBED) run = EMBED.runs[name];
  else {
    const r = await fetch(`/api/demo_runs/${encodeURIComponent(name)}`);
    if (!r.ok) { $('incident').textContent = `재생 기록 '${name}' 이 없습니다 — scripts/record_demo.py 로 먼저 기록하세요`; return; }
    run = await r.json();
  }
  const evs = run.events, total = evs[evs.length-1].t - evs[0].t;
  $('gateInfo').textContent = `${run.meta.case_id} · 실제 소요 ${fmt(total)} · 기록 ${run.meta.recorded_at}`;
  $('replayGate').classList.remove('hidden');
  await new Promise(res => {
    const go = () => { $('replayGate').classList.add('hidden'); removeEventListener('keydown', key); res(); };
    const key = e => { if (e.code === 'Space') { e.preventDefault(); go(); } };
    $('replayGate').onclick = go; addEventListener('keydown', key);
  });
  playRun(run, speed, cap);
}
async function playRun(run, speed, cap){
  const my = ++PLAY;
  REPLAY = run;
  const evs = run.events, t0 = evs[0].t, total = evs[evs.length-1].t - t0;
  resetUI(run.meta.case_id);
  $('equip').classList.add('hidden');
  const badge = $('replayBadge'); badge.classList.remove('hidden');
  const setBadge = t => badge.textContent = `▶ 실제 실행 기록 재생 · ${fmt(t)} / ${fmt(total)}`;
  setBadge(0); window.scrollTo({top: 0, behavior: 'smooth'});
  setStatus('AI 가 생각하는 중', 'text-[#19C2A8] border-[#19C2A8]/40', true);
  let shown = 0;
  for (let i = 0; i < evs.length; i++) {
    const gap = i ? (evs[i].t - evs[i-1].t) : 0;
    const wait = Math.min(gap / speed, cap) * 1000;
    const tick = setInterval(() => { shown = Math.min(shown + speed * 0.25, evs[i].t - t0); if (my === PLAY) setBadge(shown); }, 250);
    await new Promise(res => setTimeout(res, wait));
    clearInterval(tick);
    if (my !== PLAY) return;                 // 다른 사건을 눌렀다
    shown = evs[i].t - t0; setBadge(shown);
    handle(evs[i]);
  }
}

const P = new URLSearchParams(location.search);
if (EMBED) {
  const names = EMBED.order || Object.keys(EMBED.runs);
  if (names.length === 1) replay(names[0], +(P.get('speed') || 4), +(P.get('cap') || 3.5));
  else {
    $('equip').classList.add('hidden');
    $('incident').innerHTML = `<div class="tag text-[#FF6A2B]">시연</div>
`;
  }
}
else if (P.get('replay')) replay(P.get('replay'), +(P.get('speed') || 4), +(P.get('cap') || 3.5));
else if (P.get('case') && P.get('autostart')) start(P.get('case'));
</script>
