<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RootCause Stream</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif}
  .bar{transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .flash{animation:flash 1.2s ease-out}
  @keyframes flash{0%{background:#fef3c7}100%{background:transparent}}
  .pulse{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</head>
<body class="bg-stone-100 text-stone-900">
<header class="bg-white border-b border-stone-200 px-6 py-3 flex items-center gap-4">
  <div class="font-bold text-lg">RootCause Stream</div>
  <div class="text-sm text-stone-500">LLM 이 모르는 것을, 사람의 눈을 빌려 알아내는 진단 Agent</div>
  <div id="replayBadge" class="hidden ml-auto text-xs bg-stone-800 text-white rounded-full px-3 py-1"></div>
  <div class="ml-auto text-xs text-stone-400" id="equip">진단 {{model}} · 사진 판독 {{vlm}}</div>
</header>

<div id="replayGate" class="hidden fixed inset-0 z-50 bg-stone-900/70 flex items-center justify-center cursor-pointer">
  <div class="bg-white rounded-2xl px-10 py-8 text-center shadow-xl">
    <div class="text-lg font-bold">실제 실행 기록 재생</div>
    <div id="gateInfo" class="text-sm text-stone-500 mt-2"></div>
    <div class="mt-4 text-sm">화면 녹화를 시작한 뒤 <b>클릭</b> 또는 <b>스페이스</b></div>
  </div>
</div>

<main class="grid grid-cols-12 gap-4 p-4">
  <!-- 사건 목록 -->
  <aside class="col-span-3 space-y-2">
    <div class="text-xs font-semibold text-stone-500 px-1">사건</div>
    {% for c in cases %}
    <button onclick="start('{{c.id}}')" id="case-{{c.id}}"
      class="case w-full text-left bg-white border border-stone-200 rounded-lg px-3 py-2 hover:border-stone-400">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold px-1.5 py-0.5 rounded
          {% if c.tier=='E' %}bg-emerald-100 text-emerald-800{% elif c.tier=='D' %}bg-violet-100 text-violet-700{% elif c.tier=='C' %}bg-rose-100 text-rose-700
          {% elif c.tier=='A' %}bg-amber-100 text-amber-800{% else %}bg-stone-100 text-stone-600{% endif %}">{{c.tier}}</span>
        <span class="font-medium text-sm">{{c.id}}</span>
        <span class="ml-auto text-xs text-stone-400">{% if c.tier=='E' %}용접 1회 판정{% else %}{{c.kind}} · 알람 {{c.alarms}}{% endif %}</span>
      </div>
      <div class="text-xs text-stone-500 mt-1">{{c.blurb}}</div>
    </button>
    {% endfor %}
  </aside>

  <!-- 가운데: 사건 · 가설 · 결론 -->
  <section class="col-span-6 space-y-4">
    <div id="incident" class="bg-white border border-stone-200 rounded-xl p-4 text-stone-400 text-sm">
      왼쪽에서 사건을 고르면 Agent 가 진단을 시작합니다.
    </div>

    <div class="bg-white border border-stone-200 rounded-xl p-4">
      <div class="flex items-center mb-3">
        <div class="font-semibold">가설 보드</div>
        <div id="status" class="ml-auto text-xs text-stone-400"></div>
      </div>
      <div id="hyps" class="space-y-3 text-sm text-stone-400">—</div>
    </div>

    <div id="photoPanel" class="hidden bg-violet-50 border-2 border-violet-300 rounded-xl p-4"></div>
    <div id="final" class="hidden"></div>
  </section>

  <!-- 오른쪽: 추론 트레이스 -->
  <section class="col-span-3">
    <div class="bg-white border border-stone-200 rounded-xl p-4">
      <div class="font-semibold mb-2">추론 트레이스</div>
      <ol id="trace" class="space-y-2 text-xs"></ol>
    </div>
  </section>
</main>

<script>
let es = null, sid = null, lastScores = {}, REPLAY = null, READS = [];   // READS: 이번 촬영 요청에 온 판독들
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function resetUI(caseId){
  if (es) es.close();
  document.querySelectorAll('.case').forEach(b => b.classList.remove('ring-2','ring-stone-800'));
  $('case-'+caseId)?.classList.add('ring-2','ring-stone-800');
  $('trace').innerHTML = '';
  $('hyps').innerHTML = '<div class="pulse text-stone-400">가설 생성 중…</div>';
  $('photoPanel').classList.add('hidden'); $('final').classList.add('hidden');
  lastScores = {};
}

async function start(caseId){
  if (REPLAY) return;                       // 재생 중에는 새 진단을 시작하지 않는다
  resetUI(caseId);
  const r = await fetch('/api/sessions', {method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({case_id: caseId})});
  sid = (await r.json()).session_id;
  $('status').textContent = '진단 중'; $('status').className = 'ml-auto text-xs text-emerald-600 pulse';
  es = new EventSource(`/api/sessions/${sid}/stream`);
  es.onmessage = e => handle(JSON.parse(e.data));
  es.addEventListener('end', () => es.close());
}

function handle(ev){
  if (ev.type === 'incident' && ev.kind === 'weld_quality') {
    const s = ev.summary || {}, sp = s.setpoints || {}, lg = s.logged_during_weld || {},
          pop = s.same_setpoint_population || {}, pc = pop.peak_current_A || {}, mc = pop.mean_current_A || {};
    const band = (v, d) => d.p10 === undefined ? '' :
      `<span class="${v < d.p10 || v > d.p90 ? 'text-rose-600 font-semibold' : 'text-stone-500'}">(같은 설정 ${d.p10}–${d.p90})</span>`;
    $('incident').className = 'bg-white border border-stone-200 rounded-xl p-4';
    $('incident').innerHTML = `<div class="flex items-baseline gap-3"><div class="text-lg font-bold">${esc(ev.case_id)}</div>
      <div class="text-sm"><span class="text-emerald-700 font-semibold">용접 품질 판정</span> — 인라인 모니터가 이 용접 1회를 표시했다</div></div>
      <div class="text-xs text-stone-500 mt-1">${esc(s.machine || '')} · ${esc(s.material || '')}</div>
      <div class="grid grid-cols-2 gap-x-4 text-sm mt-2">
        <div>설정: 공압 ${sp.air_pressure_psi} psi · 통전 ${sp.weld_time_ms} ms · 각도 ${sp.electrode_angle_deg}°</div>
        <div>같은 설정 용접 ${pop.n_welds ?? '—'}회</div>
        <div>최대 전류 <b>${lg.peak_current_A}</b> A ${band(lg.peak_current_A, pc)}</div>
        <div>평균 전류 <b>${lg.mean_current_A}</b> A ${band(lg.mean_current_A, mc)}</div>
      </div>
      <div class="text-xs text-stone-400 mt-2">인장시험 결과·너깃 지름은 Agent 에게 주지 않는다 (판정 그 자체이므로)</div>`;
    return;
  }
  if (ev.type === 'incident') {
    const s = ev.summary || {};
    const kind = ev.kind === 'level_shift'
      ? '<span class="text-amber-700 font-semibold">수준 이동</span> — 알람 폭주가 아니다. 공정이 조용히 이동했다'
      : '<span class="text-rose-700 font-semibold">알람 폭주</span> — 대부분은 결과다. 원인을 찾아야 한다';
    $('incident').className = 'bg-white border border-stone-200 rounded-xl p-4';
    $('incident').innerHTML = `<div class="flex items-baseline gap-3"><div class="text-lg font-bold">${esc(ev.case_id)}</div>
      <div class="text-sm">알람 <b>${ev.alarm_count}</b>건</div></div>
      <div class="text-sm mt-1">${kind}</div>
      <div class="text-xs text-stone-400 mt-1">${esc((ev.window||[]).join(' → '))}</div>`;
  }
  if (ev.type === 'step') {
    renderHyps(ev.hypotheses);
    const icon = {use_tool:'🔧', request_photo:'📷', finalize:'✅'}[ev.action] || '•';
    const label = ev.tool || ev.action;
    const li = document.createElement('li');
    li.className = 'border-l-2 border-stone-300 pl-2 flash';
    li.innerHTML = `<div><b>${ev.step}</b> ${icon} ${esc(label)}</div>
      ${ev.evidence ? `<div class="text-stone-500">[${esc(ev.evidence.id)}] ${esc(ev.evidence.summary).slice(0,90)}</div>` : ''}
      <div class="text-stone-400">${(ev.usage?.ms/1000||0).toFixed(1)}s 누적 · 호출 ${ev.usage?.calls}</div>`;
    $('trace').appendChild(li);
  }
  if (ev.type === 'photo_request') {
    READS = [];
    renderHyps(ev.hypotheses);
    $('status').textContent = '⏸ 사람을 기다리는 중'; $('status').className = 'ml-auto text-xs text-violet-700 pulse';
    const reqs = ev.requests.map(r => `
      <div class="bg-white rounded-lg p-3 mb-2">
        <div class="font-semibold">📷 ${esc(r.target)}</div>
        <div class="text-xs text-stone-500 mt-1">${esc(r.how_to_shoot)}</div>
        <div class="text-sm mt-2"><b>왜:</b> ${esc(r.why_this_photo)}</div>
        <div class="text-xs mt-2 text-violet-700">가르는 가설: ${esc((r.discriminates||[]).join(', '))}</div>
        <details class="text-xs mt-1 text-stone-500"><summary>사진을 보기 전에 선언한 해석</summary>
          <pre class="whitespace-pre-wrap">${esc(JSON.stringify(r.if_observed, null, 1))}</pre></details>
      </div>`).join('');
    $('photoPanel').innerHTML = `
      <div class="flex gap-4">
        <div class="flex-1">
          <div class="font-bold text-violet-900 mb-2">센서로는 더 가를 수 없어 촬영을 요청합니다</div>
          ${reqs}
        </div>
        <div class="w-48 text-center">
          ${REPLAY ? `<div class="w-44 h-44 mx-auto rounded bg-white border-2 border-dashed border-violet-300 flex items-center justify-center text-xs text-violet-700 p-3">QR — 휴대폰으로 스캔하면 촬영 화면이 열린다</div>`
                   : `<img src="/qr/${ev.token}.png" class="w-44 mx-auto rounded bg-white p-1">`}
          <div class="text-xs text-violet-800 mt-1">휴대폰으로 스캔해 촬영</div>
          <div class="text-[10px] text-stone-400 break-all mt-1">${esc(ev.upload_url)}</div>
        </div>
      </div>
      ${REPLAY ? `<div class="mt-3 pt-3 border-t border-violet-200 text-xs text-violet-800 pulse">작업자의 응답을 기다리는 중 — 루프는 여기서 멈춰 있다</div>` : `
      <div class="mt-3 pt-3 border-t border-violet-200">
        <div class="text-xs text-stone-500 mb-2">휴대폰이 없으면 — 준비된 사진으로 응답</div>
        <div id="demoOpts" class="flex gap-2 flex-wrap"></div>
        <button onclick="noPhoto()" class="mt-2 text-xs text-stone-500 underline">사진 없이 진행 (타임아웃 경로)</button>
      </div>`}`;
    $('photoPanel').classList.remove('hidden');
    if (!REPLAY) loadDemo();
  }
  if (ev.type === 'photo_received') {
    $('photoPanel').innerHTML = READS.join('') + `<div class="pulse text-violet-800 font-semibold ${READS.length ? 'mt-3 pt-3 border-t border-violet-200' : ''}">
      사진 수신${ev.face ? ' (' + esc(ev.face) + ')' : ''} — VLM 판독 중…${ev.reference ? ' (정상 샘플과 비교)' : ''}</div>
      <div class="flex gap-3 mt-2">${photoFig(ev.photo, '받은 사진' + (ev.face ? ' · ' + ev.face : ''))}${ev.reference ? photoFig(ev.reference, '정상 샘플 (같은 설정 · 합격)') : ''}</div>`;
  }
  if (ev.type === 'photo_read') {
    const r = ev.reading;
    const mark = v => v === true ? '<b class="text-rose-600">보임</b>' : v === false ? '<span class="text-stone-500">안 보임</span>' : '<span class="text-stone-400">판단 불가</span>';
    const checks = (r.checks || []).map(c => `<li>${mark(c.visible)} — ${esc(c.observation)}</li>`).join('');
    const decl = (ev.declaration || []).map(d => `<li>보인 관찰 → 선언: ${esc(Object.entries(d.declared).map(([h,e]) => h + ' ' + ({support:'지지',weaken:'약화',refute:'반박'}[e]||e)).join(', '))}</li>`).join('');
    const card = `<div class="flex gap-4 ${READS.length ? 'mt-3 pt-3 border-t border-violet-200' : ''}">
      <div class="flex gap-2 shrink-0">${photoFig(ev.photo, '받은 사진' + (ev.face ? ' · ' + ev.face : ''))}${ev.reference ? photoFig(ev.reference, '정상 샘플') : ''}</div>
      <div class="text-sm"><div class="font-semibold text-violet-900">판독 결과 [${esc(ev.evidence_id)}]${ev.face ? ' — ' + esc(ev.face) : ''}</div>
        <div class="mt-1">${esc(r.observation)}</div>
        ${ev.reference ? `<div class="mt-1 text-xs"><b>정상 샘플과 비교:</b> ${r.differs_from_reference === true ? '<b class="text-rose-600">결함을 뜻하는 차이 있음</b>' : r.differs_from_reference === false ? '정상 범위의 차이' : '판단 불가'}
          ${r.reference_difference ? ' — ' + esc(r.reference_difference) : ''}</div>` : ''}
        ${checks ? `<div class="mt-2 text-xs text-stone-700">Agent 가 사진을 보기 전에 선언한 관찰<ul class="list-disc ml-4">${checks}</ul></div>` : ''}
        ${decl ? `<div class="mt-1 text-xs text-violet-800"><ul class="list-disc ml-4">${decl}</ul></div>` : ''}
        </div></div>`;
    READS.push(card);
    $('photoPanel').innerHTML = READS.join('') + '<div class="text-xs text-emerald-700 mt-2 pulse">이 증거로 가설을 다시 평가합니다…</div>';
    $('status').textContent = '진단 재개'; $('status').className = 'ml-auto text-xs text-emerald-600 pulse';
  }
  if (ev.type === 'photo_timeout') {
    $('photoPanel').innerHTML = '<div class="text-stone-500 text-sm">사진 없이 진행합니다 — 가진 증거만으로 결론을 냅니다.</div>';
  }
  if (ev.type === 'final') {
    renderHyps(ev.hypotheses);
    $('status').textContent = `완료 · ${ev.steps}스텝`; $('status').className = 'ml-auto text-xs text-stone-500';
    $('final').className = 'bg-emerald-50 border-2 border-emerald-300 rounded-xl p-4';
    $('final').innerHTML = `<div class="font-bold text-emerald-900">결론 (확신 ${(ev.confidence ?? 0).toFixed(2)})</div>
      <div class="mt-1">${esc(ev.root_cause || '결론 없음 — ' + ev.status)}</div>
      ${ev.challenge ? `<details class="mt-2 text-xs text-amber-800"><summary>결론을 내기 전, 사진을 보기 전의 선언과 어긋나 한 번 되물었다</summary>
        <ul class="list-disc ml-4 mt-1">${ev.challenge.conflicts.map(c => '<li>' + esc(c) + '</li>').join('')}</ul>
        <div class="mt-1 text-stone-500">되묻기 전 초안: ${esc(ev.challenge.draft_root_cause)}</div></details>` : ''}
      <div class="text-xs text-stone-500 mt-2">근거 증거: ${esc((ev.cited||[]).join(', '))} · 호출 ${ev.usage?.calls}회</div>`;
  }
  if (ev.type === 'error') {
    $('final').className = 'bg-rose-50 border border-rose-300 rounded-xl p-4 text-sm';
    $('final').textContent = '오류: ' + ev.message;
  }
}

function photoFig(path, label){
  return `<figure class="w-36"><img src="/photo?path=${encodeURIComponent(path)}" class="w-36 h-28 object-cover rounded border border-violet-200">
    <figcaption class="text-[10px] text-stone-500 mt-0.5">${esc(label)}</figcaption></figure>`;
}

function renderHyps(hs){
  $('hyps').innerHTML = (hs||[]).slice(0,4).map(h => {
    const prev = lastScores[h.id]; const d = prev === undefined ? 0 : h.score - prev;
    const arrow = Math.abs(d) < .02 ? '' : (d > 0 ? `<span class="text-emerald-600">▲${d.toFixed(2)}</span>`
                                                   : `<span class="text-rose-500">▼${(-d).toFixed(2)}</span>`);
    return `<div><div class="flex gap-2 text-stone-800"><b>${esc(h.id)}</b>
        <span class="flex-1">${esc(h.statement)}</span>
        <span class="font-mono">${h.score.toFixed(2)}</span> ${arrow}</div>
      <div class="h-2 bg-stone-100 rounded mt-1"><div class="bar h-2 rounded ${h.score>.6?'bg-emerald-500':'bg-stone-400'}"
        style="width:${(prev??0)*100}%" data-w="${h.score*100}"></div></div>
      <div class="text-[11px] text-stone-400 mt-0.5">근거 ${esc((h.cited||[]).join(', ')||'—')}</div></div>`;
  }).join('');
  requestAnimationFrame(() => document.querySelectorAll('.bar').forEach(b => b.style.width = b.dataset.w + '%'));
  (hs||[]).forEach(h => lastScores[h.id] = h.score);
}

async function loadDemo(){
  const r = await fetch(`/api/sessions/${sid}/demo_photos`); const d = await r.json();
  const f = d.options.find(o => o.shows === 'this_weld'), b = d.options.find(o => o.shows === 'this_weld_back');
  const both = (f && b) ? `<button onclick='useDemoMany(${JSON.stringify([f.path, b.path])})' class="bg-white border border-violet-200 rounded p-1 hover:border-violet-500 text-left w-32">
      <div class="flex gap-0.5"><img src="/photo?path=${encodeURIComponent(f.path)}" class="w-1/2 h-20 object-cover rounded"><img src="/photo?path=${encodeURIComponent(b.path)}" class="w-1/2 h-20 object-cover rounded"></div>
      <div class="text-[10px] text-stone-600 mt-1">이 용접 · 앞면 + 뒷면</div></button>` : '';
  $('demoOpts').innerHTML = both + d.options.map(o => `
    <button onclick='useDemo(${JSON.stringify(o.path)})' class="bg-white border border-violet-200 rounded p-1 hover:border-violet-500 text-left w-32">
      <img src="/photo?path=${encodeURIComponent(o.path)}" class="w-full h-20 object-cover rounded">
      <div class="text-[10px] text-stone-600 mt-1">${esc(o.key)}</div></button>`).join('');
}
async function useDemo(path){
  await fetch(`/api/sessions/${sid}/demo_photo`, {method:'POST', headers:{'Content-Type':'application/json'},
                                                  body: JSON.stringify({path})});
}
async function useDemoMany(paths){
  await fetch(`/api/sessions/${sid}/demo_photo`, {method:'POST', headers:{'Content-Type':'application/json'},
                                                  body: JSON.stringify({paths})});
}
async function noPhoto(){ await fetch(`/api/sessions/${sid}/no_photo`, {method:'POST'}); }

// ── 녹화용 재생 ────────────────────────────────────────────────
// scripts/record_demo.py 가 저장한 실제 실행의 이벤트를 '보여주는 시점'만 압축해 재생한다.
// 내용은 그대로이고, 배지에 실제 경과 시간을 함께 띄운다.
//   /?replay=a25-photo            (기본: 4배속, 이벤트 사이 최대 3.5초)
//   /?replay=a25-photo&speed=6&cap=2.5
//   /?case=A-2020-03-25&autostart=1   (라이브로 바로 시작)
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
async function replay(name, speed, cap){
  const r = await fetch(`/api/demo_runs/${encodeURIComponent(name)}`);
  if (!r.ok) { $('incident').textContent = `재생 기록 '${name}' 이 없습니다 — scripts/record_demo.py 로 먼저 기록하세요`; return; }
  const run = await r.json(); REPLAY = run;
  const evs = run.events, t0 = evs[0].t, total = evs[evs.length-1].t - t0;
  $('gateInfo').textContent = `${run.meta.case_id} · 실제 소요 ${fmt(total)} · 기록 ${run.meta.recorded_at}`;
  $('replayGate').classList.remove('hidden');
  await new Promise(res => {
    const go = () => { $('replayGate').classList.add('hidden'); removeEventListener('keydown', key); res(); };
    const key = e => { if (e.code === 'Space') { e.preventDefault(); go(); } };
    $('replayGate').onclick = go; addEventListener('keydown', key);
  });
  resetUI(run.meta.case_id);
  $('equip').classList.add('hidden');
  const badge = $('replayBadge'); badge.classList.remove('hidden');
  const setBadge = t => badge.textContent = `▶ 실제 실행 기록 · 시간 압축 재생 · 실제 경과 ${fmt(t)} / ${fmt(total)}`;
  setBadge(0);
  $('status').textContent = '진단 중'; $('status').className = 'ml-auto text-xs text-emerald-600 pulse';
  let shown = 0;
  for (let i = 0; i < evs.length; i++) {
    const gap = i ? (evs[i].t - evs[i-1].t) : 0;
    const wait = Math.min(gap / speed, cap) * 1000;
    const tick = setInterval(() => { shown = Math.min(shown + speed * 0.25, evs[i].t - t0); setBadge(shown); }, 250);
    await new Promise(res => setTimeout(res, wait));
    clearInterval(tick); shown = evs[i].t - t0; setBadge(shown);
    handle(evs[i]);
  }
}

const P = new URLSearchParams(location.search);
if (P.get('replay')) replay(P.get('replay'), +(P.get('speed') || 4), +(P.get('cap') || 3.5));
else if (P.get('case') && P.get('autostart')) start(P.get('case'));
</script>
