<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RootCause Stream</title>
<!-- v5 (2026-11-23, 사용자가 시안 B '검사 장비' 선택): 공장 비전 검사기 소프트웨어 모양.
     가운데 영상 창(사진 · 검사 영역 상자), 오른쪽 판정 램프(판정 전 회색 → 진행 파랑 → NG 빨강 / OK 초록), 아래 시간순 로그.
     1920×1080 한 화면, 스크롤 없음. 화면에 설명 문구를 덧붙이지 않는다. 순수 CSS (Tailwind 없음). -->
<style>
  :root{
    --bg:#1E2329; --panel:#252B32; --bar:#2B323A; --line:#3A434D; --view:#0F1215;
    --text:#D9DEE3; --dim:#9AA5B1; --white:#FFFFFF;
    --ng:#E5484D; --ng-lamp:#C62828; --ok:#52C41A; --ok-text:#7CD992; --warn:#FFC53D; --run:#4C9AFF;
    --font:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:17px/1.45 var(--font);font-variant-numeric:tabular-nums;
       display:grid;grid-template-rows:52px 3px minmax(0,1fr) 200px auto;height:100vh;overflow:hidden}
  .hidden{display:none!important}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--run);outline-offset:2px}

  /* 위: 이름 · 사건 탭 · 재생 상태 */
  .top{display:flex;align-items:stretch;background:var(--bar);border-bottom:1px solid var(--line);min-width:0}
  .brand{padding:0 24px;font-weight:800;font-size:18px;color:var(--white);border-right:1px solid var(--line);display:flex;align-items:center;white-space:nowrap}
  .tabs{display:flex;overflow-x:auto;scrollbar-width:none;min-width:0}
  .case{border:0;border-right:1px solid var(--line);background:none;padding:0 22px;color:var(--dim);cursor:pointer;white-space:nowrap;font-size:16px}
  .case b{font-weight:700;margin-right:8px}
  .case:hover{color:var(--text)}
  .case.on{background:var(--bg);color:var(--white)}
  .case.on b{font-weight:800}
  .st{margin-left:auto;padding:0 24px;display:flex;align-items:center;gap:8px;color:var(--dim);white-space:nowrap;font-size:16px}
  .st b{color:var(--ok-text);font-weight:700}
  #progress{background:var(--bar)} #progress i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s linear}

  /* 가운데: 영상 창 + 판정 */
  main{display:grid;grid-template-columns:minmax(0,1fr) 470px;min-height:0}
  #view{background:var(--view);position:relative;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;min-height:0;overflow:hidden}
  .side{background:var(--panel);border-left:1px solid var(--line);padding:20px 22px;overflow:auto;min-height:0}

  /* 영상 창: 카메라 한 칸 */
  .cam{position:relative;overflow:hidden;background:#000;flex:1 1 0;max-width:calc(50% - 3px);aspect-ratio:1;max-height:100%}
  .cam img.main{width:100%;height:100%;object-fit:cover;display:block}
  .cam .hd{position:absolute;left:0;top:0;right:0;background:rgba(15,18,21,.82);padding:8px 14px;font-size:15px;display:flex;gap:14px;align-items:baseline}
  .cam .hd b{color:var(--white);font-size:16px}
  .cam .ref{position:absolute;right:12px;top:66px;width:22%;aspect-ratio:1;border:2px solid var(--dim)}
  .cam .ref img{width:100%;height:100%;object-fit:cover;display:block}
  .cam .ref span{position:absolute;left:-2px;right:-2px;bottom:-24px;background:rgba(15,18,21,.82);font-size:13px;text-align:center;color:var(--text)}
  .roi{position:absolute;left:27%;top:25%;width:46%;height:46%;border:3px solid}
  .roi span{position:absolute;left:-3px;top:-28px;font-size:14px;font-weight:800;padding:2px 8px;color:#fff;white-space:nowrap}
  .roi.ng{border-color:var(--ng)} .roi.ng span{background:var(--ng-lamp)}
  .roi.ok{border-color:var(--ok)} .roi.ok span{background:var(--ok);color:#0F1215}
  .roi.wait{border:3px dashed var(--warn);animation:blink 1s steps(2) infinite} .roi.wait span{background:var(--warn);color:#1E2329}
  @keyframes blink{50%{border-color:transparent}}
  .cam .obs{position:absolute;left:0;right:0;bottom:0;background:rgba(15,18,21,.86);padding:10px 14px 12px;font-size:16px;color:var(--text);cursor:pointer}
  .more .rest{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;color:var(--dim);font-size:15px}
  .more.open .rest{display:block}
  .nm{font-weight:700;color:var(--white)}

  /* 영상 창: 기록 그림 · 촬영 요청 */
  .plot{width:100%;max-width:1200px;padding:20px 30px}
  .plot h2,.order h2{margin:0 0 14px;font-size:18px;color:var(--white)}
  .plot svg{display:block;width:100%;height:auto;background:#151A1F;border:1px solid var(--line)}
  .plot .cap{display:flex;gap:28px;margin-top:10px;font-size:15px;color:var(--dim)}
  .order{width:100%;max-width:1260px;padding:20px 30px;display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:26px;align-items:start}
  .order h2{grid-column:1/-1;margin:0}
  .order ol{list-style:none;margin:0;padding:0;counter-reset:o}
  .order li{counter-increment:o;background:var(--panel);border-left:4px solid var(--run);padding:16px 18px 16px 58px;position:relative;margin-bottom:12px}
  .order li::before{content:counter(o);position:absolute;left:18px;top:12px;font-size:26px;font-weight:800;color:var(--run)}
  .order li b{display:block;font-size:20px;color:var(--white);line-height:1.35}
  .order li p{margin:6px 0 0;font-size:15px;color:var(--dim)}
  .order li .why{margin-top:6px;font-size:16px}
  .phone{width:200px;border:7px solid #3A434D;border-radius:28px;background:var(--bg);padding:12px 10px 14px}
  .phone .bar{width:48px;height:5px;border-radius:3px;background:#3A434D;margin:0 auto 10px}
  .phone .t{font-size:11px;font-weight:800;color:var(--white);margin-bottom:6px}
  .phone .r{font-size:11px;line-height:1.35;border-left:3px solid var(--run);background:var(--panel);padding:6px 7px;margin-bottom:6px}
  .phone .go{background:var(--run);color:#fff;text-align:center;font-size:13px;font-weight:800;padding:9px 0;margin-top:4px}
  .qr{width:200px;background:#fff;padding:8px} .qr+div{font-size:12px;color:var(--dim);word-break:break-all;margin-top:6px}
  .live-ctl{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .live-ctl button{border:1px solid var(--line);background:var(--panel);padding:6px;cursor:pointer;font-size:14px;text-align:left}
  .live-ctl img{width:110px;height:76px;object-fit:cover;display:block}
  .live-ctl .flat{border:0;background:none;text-decoration:underline;color:var(--dim)}

  /* 판정 램프 */
  .lamp{text-align:center;padding:16px 10px 14px;background:#3A434D;color:#C9D1D9}
  .lamp b{display:block;font-size:58px;line-height:1.05;letter-spacing:.03em;color:var(--white)}
  .lamp span{font-size:17px}
  .lamp.run{background:#1D3B63} .lamp.run b{font-size:34px;padding:12px 0 6px}
  .lamp.ng{background:var(--ng-lamp);color:#fff} .lamp.ok{background:#2E7D32;color:#fff} .lamp.warn{background:#8A6A12;color:#fff}
  .lamp.hit{animation:hit .5s ease-out}
  @keyframes hit{0%{transform:scale(.92);opacity:.4}100%{transform:none;opacity:1}}
  .side h3{margin:18px 0 6px;font-size:15px;color:var(--dim);font-weight:600}
  table.m{width:100%;border-collapse:collapse;font-size:16px}
  table.m td{padding:8px 6px;border-bottom:1px solid var(--line)}
  table.m td:nth-child(2){color:var(--white);font-weight:700}
  table.m td:nth-child(3){color:var(--dim);font-size:14px}
  table.m td:last-child{text-align:right;font-weight:700}
  .g{color:var(--ok-text)} .y{color:var(--warn)}
  .hyp{display:grid;grid-template-columns:minmax(0,1fr) 60px;align-items:center;column-gap:8px;padding:5px 0;cursor:pointer;font-size:16px}
  .hyp .p{text-align:right;font-weight:700}
  .hyp .meter{grid-column:1/-1;height:6px;background:var(--line);margin-top:4px}
  .hyp .meter i{display:block;height:100%;background:#6B7783;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .hyp.lead{color:var(--white);font-weight:700} .hyp.lead .meter i{background:#E6EAEE}
  .hyp .full{grid-column:1/-1;display:none;font-size:14px;color:var(--dim);margin-top:4px;font-weight:400}
  .hyp.open .full{display:block}
  .up{color:var(--ok-text);font-size:13px} .down{color:var(--ng);font-size:13px}
  #final .note{font-size:16px} #final .note .more>div:first-child{color:var(--white)}
  .cites{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .cites span{font-size:13px;border:1px solid var(--line);padding:2px 8px;color:var(--dim)}

  /* 아래: 시간순 로그 */
  #log{background:#171B20;border-top:1px solid var(--line);overflow:auto;padding:6px 24px}
  #log table{width:100%;border-collapse:collapse;font-size:16px}
  #log td{padding:7px 10px;border-bottom:1px solid #262C33;vertical-align:top}
  #log td:nth-child(1){color:var(--dim);width:72px}
  #log td:nth-child(2){width:110px;font-size:14px;color:var(--dim)}
  #log td:nth-child(3){width:190px;color:var(--white);font-weight:700}
  #log td:nth-child(4){color:#B9C2CB}
  #log tr.ng td:nth-child(3){color:#FF7875} #log tr.ok td:nth-child(3){color:var(--ok-text)}
  #log tr.new{animation:row 1.2s ease-out}
  @keyframes row{0%{background:#22303D}100%{background:transparent}}

  #replayGate{position:fixed;inset:0;background:rgba(15,18,21,.85);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9}
  #replayGate>div{background:var(--panel);border:1px solid var(--line);padding:36px 56px;text-align:center}
  #replayGate b{display:block;font-size:28px;color:var(--white)}
  #replayGate span{color:var(--dim)}
  footer{font-size:13px;color:var(--dim);padding:4px 24px 6px;background:#171B20}

  @media (max-height:900px),(max-width:1500px){
    body{grid-template-rows:48px 3px minmax(0,1fr) 150px auto}
    main{grid-template-columns:minmax(0,1fr) 380px}
    .lamp b{font-size:44px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">RootCause Stream</div>
  <div class="tabs">
    {% for c in cases %}<button onclick="start('{{c.id}}')" id="case-{{c.id}}" class="case"><b>{{c.id}}</b>{{c.blurb or ({'level_shift': '수준 이동', 'burst': '알람 폭주'}.get(c.kind, c.kind))}}</button>{% endfor %}
  </div>
  <div class="st" id="equip">진단 {{model}}, 사진 판독 {{vlm}}</div>
  <div class="st hidden" id="replayBadge"></div>
</div>
<div id="progress"><i></i></div>

<div id="replayGate" class="hidden"><div><b>실제 실행 기록 재생</b><span id="gateInfo"></span></div></div>

<main>
  <section id="view"></section>
  <section class="side">
    <div class="lamp" id="lamp"><b>—</b><span id="lampSub"></span></div>
    <div id="record"></div>
    <h3>가설</h3><div id="hyps"></div>
    <div id="final" class="hidden"></div>
  </section>
</main>

<section id="log"><table><tbody id="logBody"></tbody></table></section>

<script>
let es = null, sid = null, lastScores = {}, REPLAY = null, CAMS = [], T0 = null;
// 서버 없이 여는 내보내기 파일(scripts/export_replay_html.py)은 녹화 기록과 사진을 페이지 안에 싣는다
const EMBED = window.__EMBED__ || null;
const photoURL = p => (EMBED && EMBED.photos[p]) || `/photo?path=${encodeURIComponent(p)}`;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOOL_KO = {search_manual: '매뉴얼 검색', lookup_diagram: '도면 찾기', query_timeseries: '공정 기록 조회',
                 recall_cases: '과거 사례 찾기', query_sql: '기록 직접 질의'};
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

// 화면에 보여 줄 때만 내부 기호(E1, H2)를 이름으로 바꾼다 — 녹화된 원문은 그대로, 기호는 마우스를 올리면 보인다
let EVN = {}, HN = {};
const shortName = st => String(st || '').split(/[:：]|[.。](?:\s|$)/)[0].replace(/\s*\([A-Za-z][^)]*\)/g, '').trim();
function named(text){
  return esc(text).replace(/\s?\(([EH]\d+)\)/g, '').replace(/\b[EH]\d+\(([^)]*)\)/g, '<span class="nm">$1</span>')
    .replace(/\b([EH]\d+)\b/g, (m, id) => {
      const n = id[0] === 'E' ? EVN[id] : HN[id];
      return n ? `<span title="${id}" class="nm">${esc(n)}</span>` : m;
    });
}
const evName = id => EVN[id] || id;
const firstSentence = t => { const m = String(t || '').trim().match(/^(.+?[.!?。])(\s|$)/); return m ? m[1] : String(t || ''); };
// 첫 문장은 그대로, 나머지는 줄여 두고 — 누르면 전부 (원문을 줄이지 않는다)
function more(text){
  const t = String(text || '').trim(), m = t.match(/^(.+?[.!?。])(\s+)([\s\S]+)$/);
  if (!m) return `<div>${named(t)}</div>`;
  return `<div class="more" onclick="this.classList.toggle('open')"><div>${named(m[1])}</div><div class="rest">${named(m[3])}</div></div>`;
}
function koLabel(stmt){
  const t = String(stmt || '');
  if (/[가-힣]/.test(t)) return shortName(t);
  const name = /expulsion|splash/i.test(t) ? '날림' : /acceptable|no (visible )?defect/i.test(t) ? '정상 용접'
    : /burn-through/i.test(t) ? '용락' : /cold|undersized|missing nugget/i.test(t) ? '용융 부족'
    : /misalign|off-cent/i.test(t) ? '전극 정렬 불량' : /data|acquisition|record/i.test(t) ? '데이터 수집 이상' : '';
  return name || t.split(/[.:—(]/)[0].trim();
}

// ── 판정 램프 ──
function lamp(cls, word, sub){
  const L = $('lamp'); L.className = `lamp ${cls}`; L.querySelector('b').textContent = word; $('lampSub').textContent = sub || '';
  if (cls === 'ng' || cls === 'ok' || cls === 'warn') { void L.offsetWidth; L.classList.add('hit'); }
}
function verdictOf(title){
  if (/날림|용락|부족|불량/.test(title)) return ['ng', 'NG'];
  if (/정상|합격|허용/.test(title)) return ['ok', 'OK'];
  if (/데이터|기록|수집/.test(title)) return ['warn', '기록 이상'];
  return ['warn', '확인'];
}

// ── 아래 로그 ──
function log(t, who, what, detail, cls){
  if (T0 === null) T0 = t;
  const tr = document.createElement('tr'); tr.className = `new ${cls || ''}`;
  tr.innerHTML = `<td>${fmt(t - T0)}</td><td>${esc(who)}</td><td>${esc(what)}</td><td>${detail || ''}</td>`;
  $('logBody').appendChild(tr); $('log').scrollTop = $('log').scrollHeight;
}

function resetUI(caseId){
  if (es) es.close();
  document.querySelectorAll('.case').forEach(b => b.classList.toggle('on', b.id === 'case-' + caseId));
  $('case-' + caseId)?.scrollIntoView({inline: 'nearest', block: 'nearest'});
  T0 = null; EVN = {}; HN = {}; lastScores = {}; CAMS = [];
  $('logBody').innerHTML = ''; $('view').innerHTML = ''; $('record').innerHTML = ''; $('hyps').innerHTML = '';
  $('final').classList.add('hidden'); $('progress').firstElementChild.style.width = 0;
  lamp('run', '진단 중', caseId);
}

async function start(caseId){
  // 내보낸 재생 파일: 누른 사건의 실제 실행 기록을 재생한다 (재생 중이면 그 사건으로 바로 넘어간다)
  if (EMBED) {
    const run = Object.values(EMBED.runs || {}).find(r => r.meta.case_id === caseId);
    if (run) playRun(run, +(P.get('speed') || 4), +(P.get('cap') || 3.5));
    return;
  }
  if (REPLAY) return;
  resetUI(caseId);
  const r = await fetch('/api/sessions', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({case_id: caseId})});
  sid = (await r.json()).session_id;
  es = new EventSource(`/api/sessions/${sid}/stream`);
  es.onmessage = e => handle(JSON.parse(e.data));
  es.addEventListener('end', () => es.close());
}

// ── 영상 창 그림 ──
function wave(vals, band){
  if (!vals || vals.length < 2) return '';
  const W = 1000, H = 360, px = 20, py = 24, hi = Math.max(...vals), lo = Math.min(...vals, band ? band[0] : Infinity), span = (hi - lo) || 1;
  const X = i => px + i * (W - 2 * px) / (vals.length - 1), Y = v => H - py - (v - lo) / span * (H - 2 * py);
  const line = vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const mi = vals.indexOf(hi), top = band ? Math.min(band[1], hi) : 0;
  const b = band ? `<rect x="0" y="${Y(top)}" width="${W}" height="${Y(band[0]) - Y(top)}" fill="#24303A"/>` : '';
  return `<div class="plot"><h2>용접 중 전류</h2><svg viewBox="0 0 ${W} ${H}">${b}
      <path d="${line}" fill="none" stroke="#4C9AFF" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="${X(mi)}" cy="${Y(hi)}" r="7" fill="#FFC53D"/></svg>
    <div class="cap"><span>최대 ${Math.round(hi).toLocaleString()} A</span>${band ? `<span>어두운 띠: 같은 설정 용접들의 최대 전류 범위</span>` : ''}</div></div>`;
}
function control(sh){
  const [lo, hi] = sh.control_limits, c = sh.control_center, v = sh.day_value;
  const min = Math.min(lo, v) - (hi - lo) * .6, max = hi + (hi - lo) * .6, W = 1000, H = 360;
  const Y = x => H - (x - min) / (max - min) * H;
  return `<div class="plot"><h2>그날 용접 압력 중앙값</h2><svg viewBox="0 0 ${W} ${H}">
      <rect x="0" y="${Y(hi)}" width="${W}" height="${Y(lo) - Y(hi)}" fill="#24303A"/>
      <line x1="0" x2="${W}" y1="${Y(c)}" y2="${Y(c)}" stroke="#6B7783" stroke-width="2" stroke-dasharray="8 8"/>
      <circle cx="${W * .62}" cy="${Y(v)}" r="12" fill="#E5484D"/>
      <text x="${W * .62 + 24}" y="${Y(v) + 9}" font-size="28" font-weight="800" fill="#FFFFFF">${v} bar</text></svg>
    <div class="cap"><span>관리 범위 ${lo.toFixed(2)} ~ ${hi.toFixed(2)} bar</span></div></div>`;
}
function cam(c){
  const roi = c.state === 'ng' ? '<div class="roi ng"><span>NG</span></div>' : c.state === 'ok' ? '<div class="roi ok"><span>OK</span></div>'
            : '<div class="roi wait"><span>판독 중</span></div>';
  const verdict = c.state === 'ng' ? '합격품과 다름' : c.state === 'ok' ? '합격품과 비슷' : c.state === 'wait' ? '' : '판단 불가';
  return `<div class="cam"><img class="main" src="${photoURL(c.photo)}" alt="${esc(c.face)}">${roi}
    ${c.ref ? `<div class="ref"><img src="${photoURL(c.ref)}" alt="합격품"><span>합격품</span></div>` : ''}
    <div class="hd"><b>${esc(c.face)}</b>${verdict}</div>
    ${c.text ? `<div class="obs">${more(c.text)}</div>` : ''}</div>`;
}
function drawCams(){ $('view').innerHTML = CAMS.map(cam).join(''); }
function row(label, v, unit, d){
  const out = d && d.p10 !== undefined && (v < d.p10 || v > d.p90);
  return `<tr><td>${label}</td><td>${Math.round(v).toLocaleString()} ${unit}</td>
    <td>${d ? `${Math.round(d.p10).toLocaleString()} ~ ${Math.round(d.p90).toLocaleString()}` : ''}</td>
    <td class="${out ? 'y' : 'g'}">${out ? '범위 끝' : '보통'}</td></tr>`;
}

function handle(ev){
  if (ev.type === 'incident') {
    const s = ev.summary || {};
    if (ev.kind === 'weld_quality') {
      const sp = s.setpoints || {}, lg = s.logged_during_weld || {}, pop = s.same_setpoint_population || {};
      $('record').innerHTML = `<h3>용접 기록 (같은 설정 ${pop.n_welds || ''}회 비교)</h3><table class="m">
        ${row('최대 전류', lg.peak_current_A, 'A', pop.peak_current_A)}${row('평균 전류', lg.mean_current_A, 'A', pop.mean_current_A)}
        ${row('누르는 힘', lg.peak_force_N, 'N', pop.peak_force_N)}</table>`;
      const pc = pop.peak_current_A;
      $('view').innerHTML = wave(lg.current_A, pc ? [pc.p10, pc.p90] : null);
      log(ev.t ?? 0, '진단 AI', '기록 확인', `공압 ${sp.air_pressure_psi} psi, 통전 ${sp.weld_time_ms} ms`);
    } else {
      const sh = s.shift || {};
      const w = (ev.window || []).map(x => String(x).replace('T', ' ').slice(0, 16));
      const win = w.length === 2 ? `${w[0]} ~ ${w[1].slice(0, 10) === w[0].slice(0, 10) ? w[1].slice(11) : w[1]}` : '';
      $('record').innerHTML = `<h3>알람</h3><table class="m"><tr><td>${ev.kind === 'level_shift' ? '수준 이동' : '알람 폭주'}</td><td>${ev.alarm_count}건</td><td>${esc(win)}</td><td></td></tr></table>`;
      $('view').innerHTML = sh.control_limits ? control(sh) : '';
      log(ev.t ?? 0, '진단 AI', '기록 확인', `알람 ${ev.alarm_count}건, ${esc(win)}`);
    }
    return;
  }
  if (ev.type === 'step') {
    renderHyps(ev.hypotheses);
    if (ev.evidence) EVN[ev.evidence.id] = TOOL_KO[ev.tool] || ev.tool || ev.evidence.id;
    if (ev.action === 'use_tool') log(ev.t ?? 0, '도구', TOOL_KO[ev.tool] || ev.tool, '');
    if (ev.action !== 'request_photo' && ev.action !== 'finalize' && ev.action !== 'use_tool')
      log(ev.t ?? 0, '진단 AI', '가설 갱신', esc(HN[(ev.hypotheses || []).slice().sort((a, b) => b.score - a.score)[0]?.id] || ''));
    return;
  }
  if (ev.type === 'photo_request') {
    renderHyps(ev.hypotheses); CAMS = [];
    lamp('run', '사진 대기', '작업자에게 촬영 요청');
    const items = ev.requests.map(r => `<li><b>${esc(r.target)}</b><p>${esc(r.how_to_shoot)}</p><div class="why">${esc(r.why_this_photo)}</div></li>`).join('');
    $('view').innerHTML = `<div class="order"><h2>촬영 요청</h2><ol>${items}</ol><div>
        ${REPLAY ? phone(ev.requests) : `<img class="qr" src="/qr/${ev.token}.png" alt="QR"><div>${esc(ev.upload_url)}</div>`}</div>
        ${REPLAY ? '' : '<div class="live-ctl" id="demoOpts"></div>'}</div>`;
    log(ev.t ?? 0, '진단 AI', '촬영 요청', esc(ev.requests.map(r => shortName(r.target)).join(', ')));
    if (!REPLAY) loadDemo();
    return;
  }
  if (ev.type === 'photo_received') {
    const face = ev.face ? `${ev.face}` : '사진';
    CAMS.push({photo: ev.photo, ref: ev.reference, face, state: 'wait'}); drawCams();
    lamp('run', '판독 중', `${face} 사진`);
    log(ev.t ?? 0, '작업자', `${face} 사진 도착`, '');
    return;
  }
  if (ev.type === 'photo_read') {
    const r = ev.reading, diff = r.differs_from_reference;
    EVN[ev.evidence_id] = ev.face ? `${ev.face} 사진` : '사진';
    const c = CAMS.find(x => x.photo === ev.photo && x.state === 'wait') || (CAMS.push({photo: ev.photo, ref: ev.reference, face: ev.face || '사진'}), CAMS[CAMS.length - 1]);
    c.state = diff === true ? 'ng' : diff === false ? 'ok' : 'na';
    c.text = r.observation + (ev.reference && r.reference_difference ? ' ' + r.reference_difference : '');
    drawCams();
    lamp('run', '진단 중', '사진을 보고 다시 판단');
    log(ev.t ?? 0, '판독 AI', `${ev.face || ''} 판독`.trim(), named(firstSentence(r.observation)), diff === true ? 'ng' : diff === false ? 'ok' : '');
    return;
  }
  if (ev.type === 'photo_timeout') {
    lamp('run', '진단 중', '사진 없이 진행');
    log(ev.t ?? 0, '작업자', '응답 없음', '');
    return;
  }
  if (ev.type === 'final') {
    renderHyps(ev.hypotheses);
    const top = (ev.hypotheses || []).slice().sort((a, b) => b.score - a.score)[0];
    const title = top ? koLabel(top.statement) : '결론 없음';
    const [cls, word] = verdictOf(title), conf = Math.round((ev.confidence || 0) * 100);
    lamp(cls, word, `${title} · 확신 ${conf}%`);
    $('final').innerHTML = `<h3>결론</h3><div class="note">${more(ev.root_cause || ev.status)}</div>
      <div class="cites">${(ev.cited || []).map(c => `<span title="${esc(c)}">근거 · ${esc(evName(c))}</span>`).join('')}</div>`;
    $('final').classList.remove('hidden');
    log(ev.t ?? 0, '진단 AI', '판정', `${esc(title)} (확신 ${conf}%)`, cls === 'ng' ? 'ng' : cls === 'ok' ? 'ok' : '');
    return;
  }
  if (ev.type === 'error') {
    lamp('warn', '오류', ''); log(ev.t ?? 0, '시스템', '오류', esc(ev.message), 'ng');
  }
}

// 재생 파일에는 QR 대신 작업자 휴대폰에 뜨는 화면(app/templates/mobile.html 과 같은 내용)을 이 요청 그대로 그린다
function phone(reqs){
  return `<div class="phone"><div class="bar"></div><div class="t">RootCause Stream</div>
    ${(reqs || []).map(r => `<div class="r">${esc(r.target)}</div>`).join('')}<div class="go">촬영하기</div></div>`;
}

function renderHyps(hs){
  (hs || []).forEach(h => { const n = shortName(h.statement); if (n) HN[h.id] = n; });
  const list = (hs || []).slice().sort((a, b) => b.score - a.score).slice(0, 4);
  const best = list.length ? list[0].score : 0;
  $('hyps').innerHTML = list.map(h => {
    const prev = lastScores[h.id], d = prev === undefined ? 0 : h.score - prev;
    const delta = Math.abs(d) < .02 ? '' : d > 0 ? ` <span class="up">▲${Math.round(d * 100)}</span>` : ` <span class="down">▼${Math.round(-d * 100)}</span>`;
    return `<div class="hyp ${h.score === best && best > 0 ? 'lead' : ''}" onclick="this.classList.toggle('open')" title="${esc(h.id)}">
      <span>${esc(HN[h.id] || h.statement)}</span><span class="p">${Math.round(h.score * 100)}%${delta}</span>
      <div class="meter"><i style="width:${(prev ?? 0) * 100}%" data-w="${h.score * 100}"></i></div>
      <div class="full">${esc(h.statement)}</div></div>`;
  }).join('');
  requestAnimationFrame(() => document.querySelectorAll('.meter i').forEach(b => b.style.width = b.dataset.w + '%'));
  (hs || []).forEach(h => lastScores[h.id] = h.score);
}

// ── 라이브 시연: 휴대폰이 없을 때 준비된 사진으로 응답 ──
async function loadDemo(){
  const d = await (await fetch(`/api/sessions/${sid}/demo_photos`)).json();
  const f = d.options.find(o => o.shows === 'this_weld'), b = d.options.find(o => o.shows === 'this_weld_back');
  const both = (f && b) ? `<button onclick='useDemoMany(${JSON.stringify([f.path, b.path])})'><div style="display:flex"><img src="${photoURL(f.path)}" style="width:55px"><img src="${photoURL(b.path)}" style="width:55px"></div>앞면과 뒷면</button>` : '';
  $('demoOpts').innerHTML = both + d.options.map(o => `<button onclick='useDemo(${JSON.stringify(o.path)})'><img src="${photoURL(o.path)}">${esc(o.key)}</button>`).join('')
    + `<button class="flat" onclick="noPhoto()">사진 없이 진행</button>`;
}
async function useDemo(path){ await fetch(`/api/sessions/${sid}/demo_photo`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path})}); }
async function useDemoMany(paths){ await fetch(`/api/sessions/${sid}/demo_photo`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({paths})}); }
async function noPhoto(){ await fetch(`/api/sessions/${sid}/no_photo`, {method:'POST'}); }

// ── 녹화 재생: 실제 실행의 이벤트를 '보여주는 시점'만 압축해 재생한다. 배지와 로그 시각은 실제 경과 시간 ──
//   /?replay=e323-ko  (기본 4배속, 이벤트 사이 최대 3.5초)   /?replay=e323-ko&speed=6&cap=2.5   /?case=E-323&autostart=1
let PLAY = 0;
async function replay(name, speed, cap){
  let run;
  if (EMBED) run = EMBED.runs[name];
  else {
    const r = await fetch(`/api/demo_runs/${encodeURIComponent(name)}`);
    if (!r.ok) { $('view').textContent = `재생 기록 '${name}' 이 없습니다`; return; }
    run = await r.json();
  }
  const evs = run.events;
  $('gateInfo').textContent = `${run.meta.case_id}, 실제 소요 ${fmt(evs[evs.length-1].t - evs[0].t)}`;
  $('replayGate').classList.remove('hidden');
  await new Promise(res => {
    const go = () => { $('replayGate').classList.add('hidden'); removeEventListener('keydown', key); res(); };
    const key = e => { if (e.code === 'Space') { e.preventDefault(); go(); } };
    $('replayGate').onclick = go; addEventListener('keydown', key);
  });
  playRun(run, speed, cap);
}
async function playRun(run, speed, cap){
  const my = ++PLAY; REPLAY = run;
  const evs = run.events, t0 = evs[0].t, total = evs[evs.length-1].t - t0;
  resetUI(run.meta.case_id);
  $('equip').classList.add('hidden');
  const badge = $('replayBadge'); badge.classList.remove('hidden');
  const setBadge = t => { badge.innerHTML = `실제 실행 기록 재생 <b>${fmt(t)} / ${fmt(total)}</b>`; $('progress').firstElementChild.style.width = (100 * Math.min(1, t / (total || 1))) + '%'; };
  setBadge(0);
  let shown = 0;
  for (let i = 0; i < evs.length; i++) {
    const gap = i ? (evs[i].t - evs[i-1].t) : 0, wait = Math.min(gap / speed, cap) * 1000;
    const tk = setInterval(() => { shown = Math.min(shown + speed * 0.25, evs[i].t - t0); if (my === PLAY) setBadge(shown); }, 250);
    await new Promise(res => setTimeout(res, wait));
    clearInterval(tk);
    if (my !== PLAY) return;
    shown = evs[i].t - t0; setBadge(shown);
    handle(evs[i]);
  }
}

const P = new URLSearchParams(location.search);
if (EMBED) {
  const names = EMBED.order || Object.keys(EMBED.runs);
  $('equip').classList.add('hidden');
  if (names.length === 1) replay(names[0], +(P.get('speed') || 4), +(P.get('cap') || 3.5));
}
else if (P.get('replay')) replay(P.get('replay'), +(P.get('speed') || 4), +(P.get('cap') || 3.5));
else if (P.get('case') && P.get('autostart')) start(P.get('case'));
</script>
