<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>촬영 요청 — RootCause Stream</title>
<!-- 관제 화면(dashboard.html v5 '검사 장비')과 같은 색: 짙은 회색 판, 파랑 = 진행, 빨강/초록 = 판정 -->
<style>
  :root{--bg:#1E2329;--panel:#252B32;--line:#3A434D;--text:#D9DEE3;--dim:#9AA5B1;--run:#4C9AFF;--ng:#FF7875;--ok:#7CD992;
        --font:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:17px/1.5 var(--font)}
  .brand{font-weight:800;font-size:16px;color:#fff}
  ol{list-style:none;margin:14px 0 0;padding:0;counter-reset:o}
  li{counter-increment:o;background:var(--panel);border-left:4px solid var(--run);padding:14px 16px 16px 50px;position:relative;margin-bottom:12px}
  li::before{content:counter(o);position:absolute;left:16px;top:10px;font-size:24px;font-weight:800;color:var(--run)}
  li b{display:block;font-size:19px;line-height:1.35;color:#fff}
  li p{margin:6px 0 0;color:var(--dim);font-size:15px}
  li .why{font-size:16px;margin-top:6px}
  label{display:block;background:var(--run);color:#fff;text-align:center;font-size:20px;font-weight:800;padding:20px 0;margin-top:6px;cursor:pointer}
  label:focus-within{outline:2px solid #fff}
  input{position:absolute;opacity:0;width:1px;height:1px}
  #out>div{background:var(--panel);padding:14px 16px;margin-top:12px}
  .bad{color:var(--ng);font-weight:700} .ok{color:var(--ok);font-weight:700} .wait{border-left:4px solid var(--run)}
</style>
</head>
<body>
  <div class="brand">RootCause Stream</div>
  <ol>
  {% for r in reqs %}
    <li><b>{{ r.target }}</b><p>{{ r.how_to_shoot }}</p><div class="why">{{ r.why_this_photo }}</div></li>
  {% endfor %}
  </ol>
  <form id="f"><label>촬영하기<input id="file" name="file" type="file" accept="image/*" capture="environment"></label></form>
  <div id="out"></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const out = document.getElementById('out');
  out.innerHTML = '<div class="wait">보내는 중</div>';
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch(location.pathname, {method:'POST', body: fd});
  if (!r.ok) { out.innerHTML = `<div class="bad">${esc((await r.json()).detail || '보내지 못했습니다')}</div>`; return; }
  const d = (await r.json()).reading;
  const retry = d.unreadable_reason && d.unreadable_reason !== 'null';
  out.innerHTML = `<div>${retry ? `<div class="bad">다시 찍어 주세요. ${esc(d.unreadable_reason)}</div>`
      : `<div class="${d.fault_present ? 'bad' : 'ok'}">${d.fault_present ? '이상 있음' : '이상 없음'}</div>`}
    <div>${esc(d.observation || '')}</div></div>`;
});
</script>
</body></html>
