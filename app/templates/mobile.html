<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>촬영 요청 — RootCause Stream</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}</style>
</head>
<body class="bg-stone-100 p-4">
  <div class="text-xs text-stone-500">RootCause Stream · 촬영 요청</div>
  {% for r in reqs %}
  <div class="bg-white rounded-xl p-4 mt-3">
    <div class="text-xl font-bold">📷 {{ r.target }}</div>
    <div class="text-stone-600 mt-2">{{ r.how_to_shoot }}</div>
    <div class="text-sm mt-3 bg-stone-50 rounded p-2"><b>왜 이 사진이 필요한가</b><br>{{ r.why_this_photo }}</div>
  </div>
  {% endfor %}

  <form id="f" class="mt-4">
    <label class="block w-full bg-stone-900 text-white text-center text-lg font-semibold rounded-xl py-5">
      촬영하기
      <input id="file" name="file" type="file" accept="image/*" capture="environment" class="hidden">
    </label>
  </form>
  <div id="out" class="mt-4"></div>

<script>
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const out = document.getElementById('out');
  out.innerHTML = '<div class="bg-white rounded-xl p-4 animate-pulse">업로드 · 판독 중…</div>';
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch(location.pathname, {method:'POST', body: fd});
  if (!r.ok) { out.innerHTML = `<div class="bg-rose-50 rounded-xl p-4">${(await r.json()).detail || '실패'}</div>`; return; }
  const d = (await r.json()).reading;
  const retry = d.unreadable_reason && d.unreadable_reason !== 'null';
  out.innerHTML = `<div class="bg-white rounded-xl p-4">
    <div class="font-semibold">판독 결과</div>
    <div class="mt-1">${d.observation || ''}</div>
    <div class="text-sm text-stone-500 mt-2">이상: ${d.fault_present} · 확신: ${d.confidence}</div>
    ${retry ? `<div class="mt-3 text-rose-600">다시 촬영해주세요 — ${d.unreadable_reason}</div>` :
              '<div class="mt-3 text-emerald-700">관제 화면에서 진단이 이어집니다.</div>'}</div>`;
});
</script>
</body></html>
