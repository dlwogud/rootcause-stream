<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>촬영 요청 — RootCause Stream</title>
<!-- 관제 화면(dashboard.html v4)과 같은 성적서 양식: 강판 바탕, 종이, 잉크, 노란 마커 -->
<style>
  :root{--steel:#CDD3D8;--sheet:#F4F5F2;--ink:#1A2129;--ink-2:#47525E;--marker:#F5C518;--red:#B8282B;--green:#2B7651;
        --sans:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;--serif:"AppleMyungjo","Nanum Myeongjo","Noto Serif KR",serif}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--steel);color:var(--ink);font:17px/1.5 var(--sans)}
  .mark{font-weight:800;font-size:16px}
  .mark b{display:inline-block;width:11px;height:11px;margin-right:8px;background:var(--marker);transform:rotate(45deg)}
  ol{list-style:none;margin:14px 0 0;padding:0;counter-reset:o}
  li{counter-increment:o;background:var(--sheet);border-top:4px solid var(--ink);padding:14px 16px 16px 50px;position:relative;margin-bottom:12px}
  li::before{content:counter(o);position:absolute;left:16px;top:10px;font-size:26px;font-weight:800}
  li b{display:block;font-size:20px;line-height:1.35}
  li p{margin:6px 0 0;color:var(--ink-2);font-size:16px}
  li .why{font-family:var(--serif);font-size:16px;margin-top:8px;line-height:1.65}
  label{display:block;background:var(--ink);color:var(--sheet);text-align:center;font-size:20px;font-weight:800;padding:20px 0;margin-top:6px;cursor:pointer}
  label:focus-within{outline:3px solid var(--marker)}
  input{position:absolute;opacity:0;width:1px;height:1px}
  #out>div{background:var(--sheet);padding:14px 16px;margin-top:12px}
  #out .note{font-family:var(--serif);line-height:1.7}
  #out .bad{color:var(--red);font-weight:700} #out .ok{color:var(--green);font-weight:700}
  .wait{border-left:6px solid var(--marker)}
</style>
</head>
<body>
  <div class="mark"><b></b>RootCause Stream</div>
  <ol>
  {% for r in reqs %}
    <li><b>{{ r.target }}</b><p>{{ r.how_to_shoot }}</p><div class="why">{{ r.why_this_photo }}</div></li>
  {% endfor %}
  </ol>
  <form id="f"><label>촬영하기<input id="file" name="file" type="file" accept="image/*" capture="environment"></label></form>
  <div id="out"></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const out = document.getElementById('out');
  out.innerHTML = '<div class="wait">보내는 중</div>';
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch(location.pathname, {method:'POST', body: fd});
  if (!r.ok) { out.innerHTML = `<div class="bad">${esc((await r.json()).detail || '보내지 못했습니다')}</div>`; return; }
  const d = (await r.json()).reading;
  const retry = d.unreadable_reason && d.unreadable_reason !== 'null';
  out.innerHTML = `<div>${retry ? `<div class="bad">다시 찍어 주세요. ${esc(d.unreadable_reason)}</div>`
      : `<div class="${d.fault_present ? 'bad' : 'ok'}">${d.fault_present ? '이상 있음' : '이상 없음'}</div>`}
    <div class="note">${esc(d.observation || '')}</div></div>`;
});
</script>
</body></html>
