<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>촬영 요청 — RootCause Stream</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;background:#0E1116}</style>
</head>
<body class="p-4 text-[#E6E8EB]">
  <div class="flex items-center gap-2 text-xs text-[#8A93A0]"><span class="w-2.5 h-2.5 rounded-full bg-[#FF6A2B]"></span><b class="text-white">RootCause Stream</b> · AI 가 촬영을 요청했습니다</div>
  {% for r in reqs %}
  <div class="bg-[#1F1C38] border border-[#3A3370] rounded-2xl p-4 mt-3">
    <div class="text-xl font-bold">📷 {{ r.target }}</div>
    <div class="text-[#A9A3D6] mt-2">{{ r.how_to_shoot }}</div>
    <div class="text-sm mt-3 bg-[#17152A] rounded-xl p-3 text-[#DAD6F7]"><b class="text-white">왜 이 사진이 필요한가</b><br>{{ r.why_this_photo }}</div>
  </div>
  {% endfor %}

  <form id="f" class="mt-4">
    <label class="block w-full bg-[#FF6A2B] text-white text-center text-lg font-bold rounded-2xl py-5 shadow-[0_10px_30px_-10px_#FF6A2B]">
      촬영하기
      <input id="file" name="file" type="file" accept="image/*" capture="environment" class="hidden">
    </label>
  </form>
  <div id="out" class="mt-4"></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const out = document.getElementById('out');
  out.innerHTML = '<div class="bg-[#161A21] rounded-2xl p-4 animate-pulse">업로드 · 판독 중…</div>';
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch(location.pathname, {method:'POST', body: fd});
  if (!r.ok) { out.innerHTML = `<div class="bg-[#2A1414] rounded-2xl p-4">${esc((await r.json()).detail || '실패')}</div>`; return; }
  const d = (await r.json()).reading;
  const retry = d.unreadable_reason && d.unreadable_reason !== 'null';
  out.innerHTML = `<div class="bg-[#161A21] rounded-2xl p-4">
    <div class="font-semibold">판독 결과</div>
    <div class="mt-1">${esc(d.observation)}</div>
    <div class="text-sm text-[#8A93A0] mt-2">이상: ${esc(d.fault_present)} · 확신: ${esc(d.confidence)}</div>
    ${retry ? `<div class="mt-3 text-[#FF8080]">다시 촬영해주세요 — ${esc(d.unreadable_reason)}</div>` :
              '<div class="mt-3 text-[#5FE0CB]">관제 화면에서 진단이 이어집니다.</div>'}</div>`;
});
</script>
</body></html>
